                                                <button onClick={()=>{setEditingId(null); setNewPassword('')}} className="bg-slate-300 text-white px-3 py-1.5 rounded-xl text-xs font-bold">취소</button>
                                            </div>
                                        ) : <button onClick={()=>{setEditingId(acc.id); setNewPassword('')}} className="text-sky-700 border border-sky-200 px-3 py-2 rounded-xl text-sm font-bold bg-white">비번변경</button>}
                                        <button onClick={() => handleDeleteAccount(acc.id)} className="text-rose-500 border border-rose-200 px-3 py-2 rounded-xl text-sm font-bold bg-white">삭제</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    </div>
                </div>
            );
        };

        const TBMFormView = ({ user, setView, showToast, setLoading, initialData }) => {
            const [form, setForm] = useState(initialData || {
                date: getLocalDateInputValue(),
                startTime: '08:30',
                endTime: '17:30',
                temperature: '',
                humidity: '',
                workName: '',
                workDesc: '',
                location: '',
                riskAssessmentDone: false,
                risks: [{ id: 1, factor: '', measure: '', result: 'yes', action: '' }],
                keyRiskId: '',
                leader: user.username,
                preChecks: { check1: false, check2: false, check3: false },
                safetyActionChecks: [],
                preJobBriefingDone: true,
                preJobBriefingAction: '',
                dailyCheckResult: '특이사항 없음',
                photoUrl: '',
                attendees: [{ name: user.username || '', signed: false, signatureUrl: '', isLeader: true }]
            });
            const [showSignModal, setShowSignModal] = useState(false);
            const [currentSignerIndex, setCurrentSignerIndex] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [showCopyOptions, setShowCopyOptions] = useState(false);
            const [copyOptions, setCopyOptions] = useState({
                overview: true,
                risks: true,
                checks: true,
                attendees: false
            });
            const [autoSaveState, setAutoSaveState] = useState('idle');
            const [lastAutoSavedAt, setLastAutoSavedAt] = useState('');
            const [draftRestored, setDraftRestored] = useState(false);
            const [didAutoLoadPrevious, setDidAutoLoadPrevious] = useState(false);
            const [validationErrors, setValidationErrors] = useState([]);
            const [sectionOpen, setSectionOpen] = useState({
                overview: true,
                risks: false,
                checks: false,
                attendees: false
            });
            const workNameRef = useRef(null);
            const locationRef = useRef(null);
            const leaderNameRef = useRef(null);
            const leaderSignatureRef = useRef(null);
            const briefingDoneRef = useRef(null);
            const briefingActionRef = useRef(null);
            const draftKey = `tbm_draft_v2_${user.department}`;
            const requiredCompletedCount = useMemo(() => {
                const leader = (form.attendees || []).find(att => att.isLeader);
                return [
                    !!form.workName?.trim(),
                    !!form.location?.trim(),
                    !!leader?.name?.trim(),
                    !!leader?.signatureUrl
                ].filter(Boolean).length;
            }, [form]);
            const progressPercent = Math.round((requiredCompletedCount / 4) * 100);
            const isReadyToSave = requiredCompletedCount === 4;

            useEffect(() => {
                if (initialData) return;
                const raw = localStorage.getItem(draftKey);
                if (!raw) return;
                try {
                    const saved = JSON.parse(raw);
                    // 지난 날짜의 임시저장은 버린다 (TBM은 당일 단위 문서)
                    if (saved.date !== getLocalDateInputValue()) {
                        localStorage.removeItem(draftKey);
                        return;
                    }
                    setForm(prev => ({ ...prev, ...saved }));
                    setDraftRestored(true);
                    showToast("이전에 작성 중이던 내용을 불러왔습니다.", "info");
                } catch (err) {
                    console.warn("임시저장 데이터 파싱 실패:", err);
                }
            }, []);

            useEffect(() => {
                if (initialData) return;
                setAutoSaveState('saving');
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem(draftKey, JSON.stringify(form));
                        setAutoSaveState('saved');
                        setLastAutoSavedAt(new Date().toLocaleTimeString());
                    } catch (err) {
                        console.warn("임시저장 실패:", err);
                        setAutoSaveState('error');
                    }
                }, 900);
                return () => clearTimeout(timer);
            }, [form, initialData]);

            const toggleSection = (key) => {
                setSectionOpen((prev) => ({ ...prev, [key]: !prev[key] }));
            };

            const addRiskRow = () => setForm(p => ({...p, risks: [...p.risks, { id: Date.now(), factor: '', measure: '', result: 'yes', action: '' }]}));
            const updateRisk = (id, f, v) => setForm(p => ({...p, risks: p.risks.map(r => r.id===id ? {...r, [f]: v} : r)}));
            const removeRisk = (id) => setForm(p => ({...p, risks: p.risks.filter(r => r.id !== id)}));
            const duplicateRiskRow = (id) => {
                setForm((prev) => {
                    const idx = prev.risks.findIndex((r) => r.id === id);
                    if (idx < 0) return prev;
                    const source = prev.risks[idx];
                    const copy = { ...source, id: Date.now() + Math.floor(Math.random() * 1000) };
                    const next = [...prev.risks];
                    next.splice(idx + 1, 0, copy);
                    return { ...prev, risks: next };
                });
            };
            const addAttendee = () => setForm(p => ({...p, attendees: [...p.attendees, { name: '', signed: false, signatureUrl: '', isLeader: false }]}));

            const removeAttendee = (idx) => {
                const newAtt = form.attendees.filter((_, i) => i !== idx);
                setForm({ ...form, attendees: newAtt });
                if (currentSignerIndex !== null) {
                    if (currentSignerIndex === idx) {
                        setShowSignModal(false);
                        setCurrentSignerIndex(null);
                    } else if (currentSignerIndex > idx) {
                        setCurrentSignerIndex(currentSignerIndex - 1);
                    }
                }
            };

            const updateAttendee = (idx, name) => {
                const newAtt = [...form.attendees];
                newAtt[idx].name = name;
                setForm({...form, attendees: newAtt});
            };
            const openSignModal = (idx) => {
                if (!form.attendees[idx].name) return showToast("이름을 먼저 입력하세요.", "error");
                if (!form.attendees[idx].isLeader) return showToast("참석자는 대표자 확인으로 서명을 생략합니다.", "info");
                setCurrentSignerIndex(idx);
                setShowSignModal(true);
            };
            const handleSaveSignature = (dataUrl) => {
                if (currentSignerIndex === null || !form.attendees[currentSignerIndex]) {
                    showToast('서명 대상 참석자를 다시 선택해 주세요.', 'error');
                    setShowSignModal(false);
                    setCurrentSignerIndex(null);
                    return;
                }
                const newAtt = [...form.attendees];
                newAtt[currentSignerIndex].signed = true;
                newAtt[currentSignerIndex].signatureUrl = dataUrl;
                setForm({ ...form, attendees: newAtt });
                setCurrentSignerIndex(null);
            };

            const buildSafetyActionChecksFromRisks = (risks) => {
                return (risks || [])
                    .filter(r => String(r.factor || '').trim() !== '')
                    .map(r => ({
                        risk: r.factor,
                        result: r.result || 'yes',
                        action: r.result === 'no' ? (r.action || '') : ''
                    }));
            };
            const applyQuickDefaults = () => {
                setForm((cur) => ({
                    ...cur,
                    temperature: cur.temperature || '25',
                    humidity: cur.humidity || '50',
                    dailyCheckResult: cur.dailyCheckResult || '특이사항 없음',
                    preChecks: { check1: true, check2: true, check3: true }
                }));
                showToast("기본값을 빠르게 입력했습니다.", "success");
            };
            const fillNoIssueTemplate = () => {
                setForm((cur) => ({
                    ...cur,
                    workDesc: cur.workDesc || '금일 작업 전 TBM 시행, 특이사항 없음.',
                    dailyCheckResult: '특이사항 없음'
                }));
                showToast("무특이 템플릿을 적용했습니다.", "info");
            };
            const toggleCopyOption = (key) => {
                setCopyOptions((prev) => ({ ...prev, [key]: !prev[key] }));
            };
            const normalizeAttendees = (arr) => {
                const next = (arr || []).map((a) => ({
                    name: a.name || '',
                    signed: !!a.signed,
                    signatureUrl: a.signatureUrl || '',
                    isLeader: !!a.isLeader
                }));
                if (!next.length) {
                    return [{ name: user.username || '', signed: false, signatureUrl: '', isLeader: true }];
                }
                next[0].isLeader = true;
                for (let i = 1; i < next.length; i++) next[i].isLeader = false;
                return next;
            };

            const handleLoadPrevious = async (opts = {}) => {
                const { silent = false } = opts;
                try {
                    setLoading(true);
                    const q = query(
                        collection(db, "global_tbm_data"),
                        where("department", "==", user.department)
                    );
                    const snap = await getDocs(q);
                    const prev = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
                        .find(d => !initialData || d.id !== initialData.id);

                    if (!prev) {
                        if (!silent) showToast("복사할 이전 TBM 데이터가 없습니다.", "info");
                        return;
                    }

                    const legacyActionMap = {};
                    (prev.safetyActionChecks || []).forEach((a) => {
                        if (!a?.risk) return;
                        legacyActionMap[a.risk] = { result: a.result || 'yes', action: a.action || '' };
                    });
                    const copiedRisks = (prev.risks || [{ factor: '', measure: '' }]).map((r, i) => {
                        const legacy = legacyActionMap[r.factor] || {};
                        return {
                            id: Date.now() + i,
                            factor: r.factor || '',
                            measure: r.measure || '',
                            result: r.result || legacy.result || 'yes',
                            action: r.action || legacy.action || ''
                        };
                    });

                    setForm((cur) => ({
                        ...cur,
                        ...(copyOptions.overview ? {
                            workName: prev.workName || '',
                            workDesc: prev.workDesc || '',
                            location: prev.location || ''
                        } : {}),
                        ...(copyOptions.risks ? {
                            riskAssessmentDone: !!prev.riskAssessmentDone,
                            risks: copiedRisks,
                            keyRiskId: ''
                        } : {}),
                        ...(copyOptions.checks ? {
                            preChecks: prev.preChecks || { check1: false, check2: false, check3: false },
                            preJobBriefingDone: prev.preJobBriefingDone ?? true,
                            preJobBriefingAction: prev.preJobBriefingAction || '',
                            dailyCheckResult: prev.dailyCheckResult || '특이사항 없음'
                        } : {}),
                        ...(copyOptions.attendees ? {
                            attendees: normalizeAttendees(prev.attendees)
                        } : {
                            attendees: normalizeAttendees(cur.attendees)
                        })
                    }));
                    if (!silent) showToast("전주 주요 내용을 복사했습니다. 날짜/시간만 확인 후 저장하세요.", "success");
                } catch (err) {
                    console.error("전주 내용 복사 실패:", err);
                    if (!silent) showToast("이전 데이터 복사 중 오류가 발생했습니다.", "error");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (initialData || draftRestored || didAutoLoadPrevious) return;
                setDidAutoLoadPrevious(true);
                handleLoadPrevious({ silent: true });
            }, [initialData, draftRestored, didAutoLoadPrevious]);

            const compressImageFile = (file) => new Promise((resolve, reject) => {
                const img = new Image();
                const blobUrl = URL.createObjectURL(file);
                img.onload = () => {
                    const maxWidth = 1600;
                    const ratio = Math.min(1, maxWidth / img.width);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * ratio);
                    canvas.height = Math.round(img.height * ratio);
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        URL.revokeObjectURL(blobUrl);
                        reject(new Error('canvas context unavailable'));
                        return;
                    }
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    URL.revokeObjectURL(blobUrl);
                    resolve(dataUrl);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(blobUrl);
                    reject(new Error('image load failed'));
                };
                img.src = blobUrl;
            });

            const handlePhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImageFile(file);
                    setForm(prev => ({...prev, photoUrl: compressed}));
                    showToast('사진을 최적화해서 첨부했습니다.', 'success');
                } catch (err) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setForm(prev => ({...prev, photoUrl: reader.result}));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const scrollToErrorField = (key) => {
                const map = {
                    workName: workNameRef,
                    location: locationRef,
                    leaderName: leaderNameRef,
                    leaderSignature: leaderSignatureRef,
                    briefingDone: briefingDoneRef,
                    briefingAction: briefingActionRef
                };
                const target = map[key]?.current;
                if (!target) return;
                setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
            };

            const handleSubmit = async () => {
                if (submitting) return;
                const nextErrors = [];
                if (!form.workName?.trim()) nextErrors.push({ key: 'workName', label: '작업명' });
                if (!form.location?.trim()) nextErrors.push({ key: 'location', label: '장소' });
                if (form.preJobBriefingDone === false && !String(form.preJobBriefingAction || '').trim()) {
                    nextErrors.push({ key: 'briefingAction', label: '작업 전 공유/교육 미실시 사유+즉시조치' });
                }
                const leader = (form.attendees || []).find(att => att.isLeader);
                if (!leader || !leader.name?.trim()) nextErrors.push({ key: 'leaderName', label: '리더 이름' });
                if (!leader?.signatureUrl) nextErrors.push({ key: 'leaderSignature', label: '리더 서명' });

                if (nextErrors.length) {
                    setValidationErrors(nextErrors);
                    setSectionOpen((prev) => ({ ...prev, overview: true, checks: true, attendees: true }));
                    showToast(`필수 입력 누락: ${nextErrors.map((e) => e.label).join(', ')}`, "info");
                    scrollToErrorField(nextErrors[0].key);
                    return;
                }
                setValidationErrors([]);
                setSubmitting(true);
                setLoading(true);
                try {
                    const selectedRisk = form.risks.find(r => r.id == form.keyRiskId);
                    const normalizedRisks = (form.risks || []).map((r) => ({
                        ...r,
                        result: r.result || 'yes',
                        action: (r.result || 'yes') === 'no' ? (r.action || '') : ''
                    }));
                    const docData = {
                        ...form,
                        risks: normalizedRisks,
                        safetyActionChecks: buildSafetyActionChecksFromRisks(normalizedRisks),
                        department: user.department,
                        keyRiskFactor: selectedRisk ? selectedRisk.factor : 'N/A',
                        keyRiskMeasure: selectedRisk ? selectedRisk.measure : 'N/A',
                        updatedAt: new Date().toISOString()
                    };
                    if (!initialData) {
                        docData.createdBy = user.username;
                        docData.createdAt = new Date().toISOString();
                        await addDoc(collection(db, "global_tbm_data"), docData);
                        showToast("등록 완료", "success");
                    } else {
                        await updateDoc(doc(db, "global_tbm_data", initialData.id), docData);
                        showToast("수정 완료", "success");
                    }
                    if (!initialData) localStorage.removeItem(draftKey);
                    setView('list');
                } catch (err) {
                    showToast("오류 발생", "error");
                }
                setLoading(false);
                setSubmitting(false);
            };

            const renderSectionTitle = (key, title, tone = 'gray') => {
                const toneClass = 'text-slate-900 border-slate-200 bg-slate-50 hover:bg-slate-100';
                return (
                    <button type="button" onClick={() => toggleSection(key)} className={`w-full flex items-center justify-between h-12 px-4 rounded-lg border text-[15px] ${toneClass}`}>
                        <span className="font-bold">{title}</span>
                        <i className={`fas fa-chevron-${sectionOpen[key] ? 'up' : 'down'} text-xs text-slate-400`}></i>
                    </button>
                );
            };

            return (
                <div className="tone-panel overflow-hidden w-full animate-fade-in-up">
                    <SectionHero chip={user.department} title={initialData ? "TBM 수정" : "TBM 등록"} subtitle="작업 개요, 위험요인, 참석자 정보를 차례로 입력합니다." />
                    <div className="p-4 sm:p-6 md:p-8 space-y-5">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                            <div className="text-sm text-slate-600">
                                필수 입력: <b className="text-slate-900">작업명·장소·리더 서명</b>
                                <span className="ml-2 text-slate-500">임시저장 {autoSaveState === 'saving' ? '저장 중...' : autoSaveState === 'saved' ? `저장됨 · ${lastAutoSavedAt}` : autoSaveState === 'error' ? '실패' : '-'}</span>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                <span className={`shrink-0 px-2.5 py-1 rounded text-xs font-bold ${isReadyToSave ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}`}>
                                    {isReadyToSave ? '저장 가능' : '필수항목 확인 필요'}
                                </span>
                                <button onClick={() => handleLoadPrevious()} className="btn btn-ghost !min-h-[36px] !px-3 text-[13px]">
                                    <i className="fas fa-copy text-slate-400"></i>전주복사
                                </button>
                                <div className="relative">
                                    <button onClick={()=>setShowCopyOptions(v=>!v)} className="btn btn-ghost !min-h-[36px] !px-3 text-[13px]">
                                        <i className="fas fa-sliders text-slate-400"></i>복사범위
                                    </button>
                                    {showCopyOptions && (
                                        <div className="absolute left-0 top-full mt-2 z-30 w-64 bg-white border border-slate-200 rounded-lg p-3 text-sm text-slate-700 shadow-lg">
                                            <div className="font-bold mb-2 text-slate-900">전주 내용 복사 범위</div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <label className="flex items-center gap-2"><input type="checkbox" checked={copyOptions.overview} onChange={()=>toggleCopyOption('overview')} />작업개요</label>
                                                <label className="flex items-center gap-2"><input type="checkbox" checked={copyOptions.risks} onChange={()=>toggleCopyOption('risks')} />위험성평가</label>
                                                <label className="flex items-center gap-2"><input type="checkbox" checked={copyOptions.checks} onChange={()=>toggleCopyOption('checks')} />점검결과</label>
                                                <label className="flex items-center gap-2"><input type="checkbox" checked={copyOptions.attendees} onChange={()=>toggleCopyOption('attendees')} />참석자</label>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <button onClick={applyQuickDefaults} className="btn btn-ghost !min-h-[36px] !px-3 text-[13px]">
                                    <i className="fas fa-wand-magic-sparkles text-slate-400"></i>기본값
                                </button>
                                <button onClick={fillNoIssueTemplate} className="btn btn-ghost !min-h-[36px] !px-3 text-[13px]">
                                    <i className="fas fa-file-lines text-slate-400"></i>무특이
                                </button>
                            </div>
                        </div>

                        <div className="kpi-strip" style={{ '--cols': 4 }}>
                            <div>
                                <div className="kpi-label">필수 입력</div>
                                <div className="kpi-value">{requiredCompletedCount}<span className="kpi-unit">/ 4</span></div>
                                <div className="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                    <div className="h-full bg-blue-600 rounded-full transition-all" style={{ width: `${progressPercent}%` }}></div>
                                </div>
                            </div>
                            <div><div className="kpi-label">위험요인</div><div className="kpi-value">{(form.risks || []).filter(r => String(r.factor || '').trim()).length}<span className="kpi-unit">건</span></div><div className="kpi-note">입력된 잠재위험 기준</div></div>
                            <div><div className="kpi-label">점검 상태</div><div className="kpi-value">{Object.values(form.preChecks || {}).filter(Boolean).length}<span className="kpi-unit">/ 3</span></div><div className="kpi-note">체크리스트 완료 수</div></div>
                            <div><div className="kpi-label">참석자</div><div className="kpi-value">{form.attendees.length}<span className="kpi-unit">명</span></div><div className="kpi-note">리더 1명 서명 필수</div></div>
                        </div>

                        {validationErrors.length > 0 && (
                            <div className="border border-red-200 bg-red-50 rounded-lg p-3 text-sm text-red-700">
                                <div className="font-bold mb-1">입력 확인 필요</div>
                                <div>{validationErrors.map((e) => e.label).join(', ')}</div>
                            </div>
                        )}

                        <section className="space-y-3">
                            {renderSectionTitle('overview', '1. 작업 개요')}
                            {sectionOpen.overview && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 border border-gray-100 rounded-lg p-4">
                                    <div>
                                        <label className="label-text">일시</label>
                                        <div className="flex gap-2 items-center flex-wrap">
                                            <input type="date" className="input-field flex-grow" value={form.date} onChange={e=>setForm({...form, date:e.target.value})} />
                                            <div className="flex items-center gap-1">
                                                <input type="time" className="input-field w-24" value={form.startTime} onChange={e=>setForm({...form, startTime:e.target.value})} />
                                                <span>~</span>
                                                <input type="time" className="input-field w-24" value={form.endTime} onChange={e=>setForm({...form, endTime:e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="label-text">장소</label>
                                        <input ref={locationRef} type="text" className="input-field" value={form.location} onChange={e=>setForm({...form, location:e.target.value})} />
                                    </div>
                                    <div className="flex gap-4 md:col-span-2">
                                        <div className="flex-1">
                                            <label className="label-text">온도 (℃)</label>
                                            <input type="number" inputMode="numeric" className="input-field" placeholder="예: 25" value={form.temperature} onChange={e=>setForm({...form, temperature:e.target.value})} />
                                        </div>
                                        <div className="flex-1">
                                            <label className="label-text">습도 (%)</label>
                                            <input type="number" inputMode="numeric" className="input-field" placeholder="예: 50" value={form.humidity} onChange={e=>setForm({...form, humidity:e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="md:col-span-2"><label className="label-text">작업명</label><input ref={workNameRef} type="text" className="input-field" value={form.workName} onChange={e=>setForm({...form, workName:e.target.value})} /></div>
                                    <div className="md:col-span-2">
                                        <label className="label-text flex items-center justify-between">내용</label>
                                        <textarea className="input-field h-20" value={form.workDesc} onChange={e=>setForm({...form, workDesc:e.target.value})}></textarea>
                                    </div>
                                </div>
                            )}
                        </section>

                        <section className="space-y-3">
                            {renderSectionTitle('risks', '2. 위험성 평가', 'yellow')}
                            {sectionOpen.risks && (
                                <div className="p-4 sm:p-6 rounded-lg border border-slate-200">
                                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-4">
                                        <h3 className="text-base font-bold text-slate-900">위험성 평가 입력</h3>
                                        <div className="flex items-center gap-1 rounded-full bg-slate-100 p-1">
                                            <button type="button" onClick={() => setForm({ ...form, riskAssessmentDone: true })} className={`px-4 h-8 text-[13px] rounded-full font-bold ${form.riskAssessmentDone ? 'bg-blue-600 text-white' : 'text-slate-600'}`}>실시</button>
                                            <button type="button" onClick={() => setForm({ ...form, riskAssessmentDone: false })} className={`px-4 h-8 text-[13px] rounded-full font-bold ${!form.riskAssessmentDone ? 'bg-slate-700 text-white' : 'text-slate-600'}`}>미실시</button>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="hidden md:grid grid-cols-12 gap-2 text-xs font-bold text-gray-500 text-center mb-1">
                                            <div className="col-span-1">No</div>
                                            <div className="col-span-3">잠재위험요인</div>
                                            <div className="col-span-3">안전대책</div>
                                            <div className="col-span-2">조치여부</div>
                                            <div className="col-span-2">'아니오' 사유</div>
                                            <div className="col-span-1">관리</div>
                                        </div>
                                        {form.risks.map((risk, idx) => (
                                            <div key={risk.id} className="grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-white p-3 rounded-lg border border-slate-200">
                                                <div className="md:col-span-1 text-center font-bold bg-gray-100 rounded-full w-7 h-7 leading-7 mx-auto md:mx-0">{idx+1}</div>
                                                <div className="md:col-span-3">
                                                    <label className="md:hidden block text-xs font-bold text-gray-500 mb-1">잠재위험요인</label>
                                                    <input type="text" className="input-field py-1 text-sm" placeholder="위험요인" value={risk.factor} onChange={e=>updateRisk(risk.id, 'factor', e.target.value)} />
                                                </div>
                                                <div className="md:col-span-3">
                                                    <label className="md:hidden block text-xs font-bold text-gray-500 mb-1">안전대책</label>
                                                    <input type="text" className="input-field py-1 text-sm" placeholder="대책" value={risk.measure} onChange={e=>updateRisk(risk.id, 'measure', e.target.value)} />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="md:hidden block text-xs font-bold text-gray-500 mb-1">조치여부</label>
                                                    <div className="grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
                                                        <button type="button" onClick={() => updateRisk(risk.id, 'result', 'yes')} className={`px-2 py-2 rounded-lg text-xs font-bold ${(risk.result || 'yes') === 'yes' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600'}`}>예</button>
                                                        <button type="button" onClick={() => updateRisk(risk.id, 'result', 'no')} className={`px-2 py-2 rounded-lg text-xs font-bold ${(risk.result || 'yes') === 'no' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'}`}>아니오</button>
                                                    </div>
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="md:hidden block text-xs font-bold text-gray-500 mb-1">'아니오' 사유</label>
                                                    <input type="text" className="input-field py-1 text-xs" placeholder="미조치 사유" value={risk.action || ''} onChange={e=>updateRisk(risk.id, 'action', e.target.value)} disabled={(risk.result || 'yes') === 'yes'} />
                                                </div>
                                                <div className="md:col-span-1 text-center flex md:block gap-1 justify-center">
                                                    <button onClick={()=>duplicateRiskRow(risk.id)} className="text-blue-500 px-2 py-1 border rounded md:border-0 text-xs"><i className="fas fa-clone mr-1 md:mr-0"></i><span className="md:hidden">복제</span></button>
                                                    <button onClick={()=>removeRisk(risk.id)} className="text-red-400 px-2 py-1 border rounded md:border-0 text-xs"><i className="fas fa-times mr-1 md:mr-0"></i><span className="md:hidden">삭제</span></button>
                                                </div>
                                            </div>
                                        ))}
                                        <button onClick={addRiskRow} className="w-full py-2 border-2 border-dashed border-gray-300 text-gray-500 rounded text-sm hover:bg-white">+ 위험요인 추가</button>
                                    </div>
                                    <div className="mt-4"><label className="label-text">중점 위험요인 선택</label><select className="input-field" value={form.keyRiskId} onChange={e=>setForm({...form, keyRiskId: e.target.value})}><option value="">선택하세요</option>{form.risks.map((r,i)=>(<option key={r.id} value={r.id}>{i+1}. {r.factor}</option>))}</select></div>
                                </div>
                            )}
                        </section>

                        <section className="space-y-3">
                            {renderSectionTitle('checks', '3. 안전점검 및 점검결과')}
                            {sectionOpen.checks && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 border border-gray-100 rounded-lg p-4">
                                    <div>
                                        <h3 className="text-base font-bold text-slate-900 mb-3 pb-2 border-b border-slate-200">작업 전 안전 점검 (Checklist)</h3>
                                        <div ref={briefingDoneRef} className="mb-4 p-3 border rounded-lg bg-slate-50 border-slate-200">
                                            <div className="text-sm font-bold text-slate-900 mb-2">작업 전 공유/교육 실시 여부</div>
                                            <div className="flex items-center gap-4">
                                                <label className="flex items-center gap-1 text-sm">
                                                    <input
                                                        type="radio"
                                                        name="preJobBriefingDone"
                                                        checked={form.preJobBriefingDone === true}
                                                        onChange={() => setForm({ ...form, preJobBriefingDone: true, preJobBriefingAction: '' })}
                                                    />
                                                    예
                                                </label>
                                                <label className="flex items-center gap-1 text-sm">
                                                    <input
                                                        type="radio"
                                                        name="preJobBriefingDone"
                                                        checked={form.preJobBriefingDone === false}
                                                        onChange={() => setForm({ ...form, preJobBriefingDone: false })}
                                                    />
                                                    아니오
                                                </label>
                                            </div>
                                            {form.preJobBriefingDone === false && (
                                                <div className="mt-2">
                                                    <label className="label-text text-red-600">미실시 사유 + 즉시조치 (필수)</label>
                                                    <input
                                                        ref={briefingActionRef}
                                                        type="text"
                                                        className="input-field"
                                                        placeholder="예: 인원 미집결로 즉시 재소집 후 공유 완료"
                                                        value={form.preJobBriefingAction || ''}
                                                        onChange={(e) => setForm({ ...form, preJobBriefingAction: e.target.value })}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-2 mb-6">
                                            <label className="flex items-center min-h-[44px] px-3 border border-slate-200 rounded-lg bg-white cursor-pointer"><input type="checkbox" className="mr-2" checked={form.preChecks.check1} onChange={e=>setForm({...form, preChecks:{...form.preChecks, check1:e.target.checked}})} />보호구 착용</label>
                                            <label className="flex items-center min-h-[44px] px-3 border border-slate-200 rounded-lg bg-white cursor-pointer"><input type="checkbox" className="mr-2" checked={form.preChecks.check2} onChange={e=>setForm({...form, preChecks:{...form.preChecks, check2:e.target.checked}})} />장비 점검</label>
                                            <label className="flex items-center min-h-[44px] px-3 border border-slate-200 rounded-lg bg-white cursor-pointer"><input type="checkbox" className="mr-2" checked={form.preChecks.check3} onChange={e=>setForm({...form, preChecks:{...form.preChecks, check3:e.target.checked}})} />건강 상태</label>
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900 mb-3 pb-2 border-b border-slate-200">작업 전 일일 안전점검 시행 결과</h3>
                                        <textarea className="input-field h-[184px]" placeholder="특이사항 없음" value={form.dailyCheckResult} onChange={e=>setForm({...form, dailyCheckResult:e.target.value})}></textarea>
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-slate-900 mb-3 pb-2 border-b border-slate-200">TBM 활동 사진</h3>
                                        <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition relative">
                                            <input type="file" accept="image/*" onChange={handlePhotoUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            {form.photoUrl ? (
                                                <div className="space-y-3">
                                                    <img src={form.photoUrl} alt="Preview" className="max-h-32 mx-auto rounded shadow" />
                                                    <div className="flex flex-wrap justify-center gap-2">
                                                        <button type="button" onClick={() => setForm(prev => ({ ...prev, photoUrl: '' }))} className="px-3 py-1.5 text-xs border border-red-200 text-red-600 rounded-lg bg-white hover:bg-red-50 relative z-10">
                                                            사진 삭제
                                                        </button>
                                                        <span className="text-xs text-gray-400 self-center">다시 클릭하면 새 사진으로 교체됩니다.</span>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-gray-400"><i className="fas fa-camera text-3xl mb-2"></i><br/>클릭하여 사진 촬영/업로드</div>
                                            )}
                                        </div>
                                        <div className="mt-2 text-xs text-gray-400">현장 사진은 압축 후 저장됩니다. 흐린 사진은 다시 촬영하는 편이 좋습니다.</div>
                                    </div>
                                </div>
                            )}
                        </section>

                        <section className="space-y-3">
                            {renderSectionTitle('attendees', `4. 참석자 (${form.attendees.length}명)`)}
                            {sectionOpen.attendees && (
                                <div className="border border-gray-100 rounded-lg p-4">
                                    <div className="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3">
                                        참석자 이름은 모두 기록하고, 서명은 리더 1명만 받습니다. 일반 참석자는 대표자 확인으로 서명을 생략합니다.
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded h-48 overflow-y-auto space-y-2 mb-3">
                                        {form.attendees.map((att, idx) => (
                                            <div key={idx} className="flex items-center gap-2 bg-white p-2 rounded border shadow-sm">
                                                <div className={`w-12 shrink-0 text-center px-1 py-1 rounded text-xs font-bold ${att.isLeader ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                                                    {att.isLeader ? '리더' : '참석'}
                                                </div>
                                                <input
                                                    ref={att.isLeader ? leaderNameRef : null}
                                                    type="text"
                                                    placeholder={att.isLeader ? "리더 이름" : "참석자 이름"}
                                                    className="border border-gray-300 rounded px-3 py-2 text-sm w-20 sm:w-28 md:w-32 shrink-0 text-center font-bold outline-none focus:ring-2 focus:ring-indigo-500 h-12"
                                                    value={att.name}
                                                    onChange={e=>updateAttendee(idx, e.target.value)}
                                                    disabled={att.signed}
                                                />
                                                <div
                                                    ref={att.isLeader ? leaderSignatureRef : null}
                                                    onClick={() => att.isLeader && !att.signed && openSignModal(idx)}
                                                    className={`flex-1 min-w-0 h-12 border rounded flex items-center justify-center transition ${att.isLeader ? (att.signed ? 'bg-white border-indigo-500 cursor-pointer' : 'bg-gray-50 border-dashed hover:bg-indigo-50 cursor-pointer') : 'bg-slate-50 border-slate-200 cursor-not-allowed text-slate-400'}`}
                                                >
                                                    {att.signed && att.signatureUrl ? <img src={att.signatureUrl} alt="서명" className="h-full object-contain" /> : <span className={`text-sm font-bold whitespace-nowrap ${att.isLeader ? 'text-gray-400' : 'text-slate-400'}`}><i className="fas fa-file-signature mr-1"></i>{att.isLeader ? '리더 서명(필수)' : '대표자 확인으로 생략'}</span>}
                                                </div>
                                                {!att.isLeader && (
                                                    <button onClick={() => removeAttendee(idx)} className="w-8 h-8 shrink-0 flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 rounded-full transition" title="참석자 삭제">
                                                        <i className="fas fa-minus-circle"></i>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                        <button onClick={addAttendee} className="w-full py-2 bg-indigo-50 text-indigo-600 font-bold rounded text-sm hover:bg-indigo-100">+ 참석자 추가(선택)</button>
                                    </div>
                                </div>
                            )}
                        </section>

                        <div className="sticky bottom-0 bg-white/95 backdrop-blur border-t pt-3 pb-[calc(env(safe-area-inset-bottom,0px)+0.25rem)] flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                            <button onClick={()=>setView('list')} disabled={submitting} className="w-full sm:w-auto min-h-12 px-6 py-3 border border-slate-300 bg-white rounded-lg disabled:opacity-50 text-base font-bold text-slate-700">취소</button>
                            <button onClick={handleSubmit} disabled={submitting} className={`w-full sm:w-auto min-h-12 px-8 py-3 text-white rounded-lg text-base font-bold ${submitting ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {submitting ? <><i className="fas fa-spinner fa-spin mr-2"></i>저장 중...</> : '저장'}
                            </button>
                        </div>
                    </div>
                    <SignatureModal
                        isOpen={showSignModal}
                        onClose={() => {
                            setShowSignModal(false);
                            setCurrentSignerIndex(null);
                        }}
                        onSave={handleSaveSignature}
                        signerName={currentSignerIndex !== null ? (form.attendees[currentSignerIndex]?.name || '') : ''}
                    />
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null); 
            const [view, setView] = useState('login'); 
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [tbms, setTbms] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [currentYear, setCurrentYear] = useState('2026'); // Default 2026
            const [availableYears, setAvailableYears] = useState(['2026']); // Default Only 2026
            const [loginId, setLoginId] = useState('');
            const [loginPw, setLoginPw] = useState('');
            const [saveId, setSaveId] = useState(false);
            const [editTbmData, setEditTbmData] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // PDF Generation State
            const [downloadingPdf, setDownloadingPdf] = useState(false);
            const [targetPdfTbm, setTargetPdfTbm] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('savedId');
                if (saved) { setLoginId(saved); setSaveId(true); }

                let unsubUsers = null;
                let unsubTbms = null;
                let mounted = true;

                const init = async () => {
                    try {
                        await signInAnonymously(auth);

                        // Fetch System Config
                        const configDoc = await getDoc(doc(db, "system_settings", "config"));
                        if (mounted && configDoc.exists()) {
                            setAvailableYears(configDoc.data().years || ['2026']);
                        }

                        // --- Sort Logic Applied Here (Global) ---
                        unsubUsers = onSnapshot(
                            query(collection(db, "app_users")),
                            (s) => {
                                if (!mounted) return;
                                const fetchedAccounts = s.docs.map(d => ({id:d.id, ...d.data()}));
                                fetchedAccounts.sort((a, b) => {
                                    const deptA = a.department || '';
                                    const deptB = b.department || '';
                                    return deptA.localeCompare(deptB, 'ko');
                                });
                                setAccounts(fetchedAccounts);
                            },
                            (err) => {
                                console.error("app_users 구독 실패:", err);
                                if (mounted) setToast({ message: "계정 데이터 구독 실패", type: "error" });
                            }
                        );

                        unsubTbms = onSnapshot(
                            query(collection(db, "global_tbm_data"), orderBy("createdAt", "desc")),
                            (s) => {
                                if (!mounted) return;
                                setTbms(s.docs.map(d => ({id:d.id, ...d.data()})));
                                setLoading(false);
                            },
                            (err) => {
                                console.error("global_tbm_data 구독 실패:", err);
                                if (mounted) {
                                    setToast({ message: "TBM 데이터 구독 실패", type: "error" });
                                    setLoading(false);
                                }
                            }
                        );
                    } catch (err) {
                        console.error("초기화 실패:", err);
                        if (mounted) {
                            setToast({ message: "초기화 중 오류가 발생했습니다.", type: "error" });
                            setLoading(false);
                        }
                    }
                };
                init();

                return () => {
                    mounted = false;
                    if (typeof unsubUsers === 'function') unsubUsers();
                    if (typeof unsubTbms === 'function') unsubTbms();
                };
            }, []);

            const showToast = (msg, type = 'info') => setToast({ message: msg, type });

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                if (saveId) localStorage.setItem('savedId', loginId);
                else localStorage.removeItem('savedId');

                try {
                    // 운영 연속성: master 계정이 아직 없을 때만 임시 관리자 로그인 허용
                    if (loginId === 'admin' && loginPw === '0908') {
                        const realMaster = accounts.find(a => a.role === 'master');
                        if (!realMaster || accounts.length === 0) {
                            setUser({ id: 'temp_master', username: 'Master Admin', role: 'master', department: '경영기획팀' });
                            setView('dashboard');
                            showToast('관리자로 로그인했습니다.', 'success');
                            return;
                        }
                    }

                    const normalizedLoginId = String(loginId || '').trim();
                    const foundUser = accounts.find(a => String(a.username || '').trim() === normalizedLoginId);
                    if (!foundUser) {
                        showToast('정보 불일치', 'error');
                        return;
                    }

                    const ok = await verifyPassword(loginPw, foundUser);
                    if (!ok) {
                        showToast('정보 불일치', 'error');
                        return;
                    }

                    // Legacy plain-password account is upgraded to hash after successful login.
                    if (!foundUser.passwordHash && typeof foundUser.password === 'string') {
                        const passwordHash = await hashPassword(loginPw);
                        await updateDoc(doc(db, "app_users", foundUser.id), {
                            passwordHash,
                            updatedAt: new Date().toISOString()
                        });
                    }

                    setUser(foundUser);
                    setView('dashboard');
                    showToast('로그인 성공', 'success');
                } catch (err) {
                    console.error("로그인 처리 실패:", err);
                    showToast('로그인 처리 중 오류', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const canManageTbm = (tbm) => {
                if (!user || !tbm) return false;
                return user.role === 'master' || tbm.department === user.department;
            };

            const handleEditTbm = (tbm) => {
                if (!canManageTbm(tbm)) {
                    showToast('해당 TBM을 수정할 권한이 없습니다.', 'error');
                    return;
                }
                setEditTbmData(tbm);
                setView('write');
            };

            const handleDeleteTbm = async (id) => {
                const target = tbms.find(t => t.id === id);
                if (!canManageTbm(target)) {
                    showToast('해당 TBM을 삭제할 권한이 없습니다.', 'error');
                    return;
                }
                if(confirm("정말 삭제하시겠습니까?")) {
                    await deleteDoc(doc(db, "global_tbm_data", id));
                    showToast("삭제 완료", "success");
                }
            };
            
            const handlePdfDownload = (tbm) => {
                if (user?.role !== 'master') {
                    showToast('PDF 다운로드는 관리자만 사용할 수 있습니다.', 'error');
                    return;
                }
                showToast("PDF 생성을 시작합니다...", "info");
                setTargetPdfTbm(tbm);
                setDownloadingPdf(true);
            };

            const handlePdfComplete = (result) => {
                setDownloadingPdf(false);
                setTargetPdfTbm(null);
                if (result?.ok) {
                    showToast("PDF 다운로드가 완료되었습니다.", "success");
                } else {
                    showToast("PDF 생성에 실패했습니다. 이미지/글꼴 상태를 확인해 주세요.", "error");
                }
            };

            const handleLogout = () => { setUser(null); setView('login'); setLoginId(''); setLoginPw(''); setMobileMenuOpen(false); };

            const myTbms = useMemo(() => {
                if (!user) return [];
                const filtered = tbms.filter(t => t.date.startsWith(currentYear));
                if (user.role === 'master') return filtered;
                return filtered.filter(t => t.department === user.department);
            }, [tbms, user, currentYear]);

            const todayQueue = useMemo(() => {
                const today = getLocalDateInputValue();
                return myTbms
                    .filter(t => t.date === today)
                    .map(t => ({ ...t, badge: '오늘 작업', meta: `${t.location || '-'} · 참석자 ${t.attendees?.length || 0}명` }));
            }, [myTbms]);

            const riskQueue = useMemo(() => {
                return myTbms
                    .filter(t => (t.risks || []).some(r => (r.result || 'yes') === 'no'))
                    .map(t => ({
                        ...t,
                        badge: '조치 필요',
                        meta: (t.risks || [])
                            .filter(r => (r.result || 'yes') === 'no')
                            .map(r => `• ${r.factor}${r.action ? ` - ${r.action}` : ''}`)
                            .join('\n')
                    }));
            }, [myTbms]);

            const stats = useMemo(() => {
                const yearTbms = myTbms.filter(t => t.date.startsWith(currentYear));
                const total = yearTbms.length;
                const safeCount = yearTbms.filter(t => t.riskAssessmentDone).length;
                const monthlyData = Array.from({length: 12}, (_, i) => ({ label: `${i+1}월`, value: 0 }));
                yearTbms.forEach(t => {
                    if(t.date) monthlyData[new Date(t.date).getMonth()].value++;
                });
                return { total, safeCount, monthlyData: monthlyData }; // REMOVED SLICE
            }, [myTbms, currentYear]);

            if (loading && !user && view !== 'login') return <div className="h-screen flex items-center justify-center flex-col"><i className="fas fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i><p>Loading...</p></div>;

            return (
                <div className="flex h-[100dvh] overflow-hidden">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Hidden PDF Generator */}
                    {downloadingPdf && targetPdfTbm && (
                        <PdfHiddenGenerator tbm={targetPdfTbm} onComplete={handlePdfComplete} />
                    )}

                    {view === 'login' ? (
                        <div className="w-full"><LoginView loginId={loginId} setLoginId={setLoginId} loginPw={loginPw} setLoginPw={setLoginPw} handleLogin={handleLogin} saveId={saveId} setSaveId={setSaveId} loading={loading} /></div>
                    ) : (
                        <>
                            <div className="app-topbar md:hidden fixed top-0 left-0 right-0 z-30 h-14 px-1.5 flex items-center justify-between">
                                <button onClick={() => setMobileMenuOpen(true)} aria-label="메뉴 열기" className="topbar-btn w-11 h-11 rounded-lg">
                                    <i className="fas fa-bars"></i>
                                </button>
                                <div className="flex items-center gap-2">
                                    <img src={LOGO_RED} alt={COMPANY_NAME} className="h-3.5" />
                                    <span className="text-[15px] font-bold">스마트 TBM</span>
                                </div>
                                <button onClick={handleLogout} aria-label="로그아웃" className="topbar-btn w-11 h-11 rounded-lg">
                                    <i className="fas fa-arrow-right-from-bracket"></i>
                                </button>
                            </div>
                            {mobileMenuOpen && (
                                <div className="md:hidden fixed inset-0 bg-black/35 z-30" onClick={() => setMobileMenuOpen(false)}></div>
                            )}
                            <Sidebar
                                user={user}
                                view={view}
                                setView={(v) => { if(v==='write') setEditTbmData(null); setView(v); }}
                                handleLogout={handleLogout}
                                mobileMenuOpen={mobileMenuOpen}
                                setMobileMenuOpen={setMobileMenuOpen}
                            />
                            <main className="flex-1 md:ml-64 p-4 sm:p-6 md:p-8 overflow-y-auto h-[100dvh] pt-[4.5rem] md:pt-8 app-main">
                                {view === 'dashboard' && <DashboardView stats={stats} tbms={myTbms} currentYear={currentYear} setCurrentYear={setCurrentYear} allTbms={myTbms} availableYears={availableYears} />}
                                {view === 'today' && <ActionQueueView title="오늘 작업" subtitle="오늘 날짜로 작성된 TBM을 빠르게 확인합니다" items={todayQueue} emptyMessage="오늘 등록된 작업이 없습니다." accent="sky" onEdit={handleEditTbm} onPdfDownload={handlePdfDownload} user={user} setView={setView} />}
                                {view === 'risks' && <ActionQueueView title="미조치 위험요인" subtitle="조치여부가 '아니오'인 위험요인을 모아봅니다" items={riskQueue} emptyMessage="현재 미조치 위험요인이 없습니다." accent="rose" onEdit={handleEditTbm} onPdfDownload={handlePdfDownload} user={user} setView={setView} />}
                                {view === 'list' && (
                                    <ListView 
                                        user={user} 
                                        myTbms={myTbms} 
                                        setView={(v) => { if(v==='write') setEditTbmData(null); setView(v); }} 
                                        accounts={accounts} 
                                        allTbms={tbms} 
                                        currentYear={currentYear} 
                                        setCurrentYear={setCurrentYear} 
                                        onEdit={handleEditTbm} 
                                        onDelete={handleDeleteTbm} 
                                        onPdfDownload={handlePdfDownload}
                                        availableYears={availableYears}
                                    />
                                )}
                                {view === 'write' && <TBMFormView user={user} setView={setView} showToast={showToast} setLoading={setLoading} initialData={editTbmData} />}
                                {view === 'admin' && <AdminView user={user} accounts={accounts} showToast={showToast} />}
                                {view === 'settings' && <SettingsView availableYears={availableYears} setAvailableYears={setAvailableYears} />}
                            </main>
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
        
        // Dynamic Style for animation
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            .app-main { background: var(--canvas); }
            .input-field {
                width: 100%;
                min-height: 44px;
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                padding: 0.6rem 0.8rem;
                background: #fff;
                outline: none;
                color: var(--ink);
                font-size: 15px;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            .input-field:focus {
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(196,30,34,0.12);
            }
            .input-field:disabled { background: var(--panel-2); color: var(--muted); }
            .label-text {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: var(--slate);
                margin-bottom: 6px;
            }
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
            .animate-fade-in-up { animation: fadeInUp 0.22s ease-out both; }
            @keyframes bounceIn { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
            .animate-bounce-in { animation: bounceIn 0.2s ease-out; }
            @keyframes modalRise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
            .animate-modal-rise { animation: modalRise 0.2s ease-out both; }
            @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
