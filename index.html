    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <style>
        /* 디자인 시스템 — 엔코스 레드&화이트
           색: 브랜드 레드 #c41e22(주요 버튼·선택 메뉴·로고에만), 바탕 흰색/연회색, 상태색(위험 주황·양호 초록)은 브랜드색과 분리
           글자: Pretendard → 맑은 고딕 / 제목 22 · 섹션 15 · 본문 14 · 수치 28(고정폭 숫자)
           면: 1px 선 + 12px 모서리, 그림자·그라데이션 없음 / 수치 묶음은 카드 대신 KPI 스트립 */
        :root {
            --brand: #c41e22;
            --brand-deep: #a3181c;
            --brand-soft: #fbeeed;
            --ink: #231a1a;
            --slate: #5b6573;
            --muted: #6f7884;
            --line: #e7e5e4;
            --line-strong: #d6d3d1;
            --canvas: #f6f6f5;
            --panel-2: #fafaf9;
            --ok: #2f7459;
            --risk: #c2410c;
        }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            color: var(--ink);
            background: var(--canvas);
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }
        .tnum { font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; border: 3px solid var(--canvas); }

        /* 면 */
        .tone-panel, .brand-stat-card, .chart-panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
        }
        .chart-panel { padding: 20px 22px; }
        .chart-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 16px;
        }

        /* 화면 머리 */
        .view-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px 16px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
        }
        .view-header-primary { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .view-title {
            font-size: 22px;
            line-height: 1.3;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.02em;
            word-break: keep-all;
        }
        .view-subtitle { font-size: 14px; color: var(--slate); }
        .hero-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--brand);
        }
        .subtle-text { color: var(--slate); }
        .muted-note { color: var(--muted); font-size: 12px; }

        /* KPI 스트립: 위 굵은 선 + 칸 사이 세로선 */
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border-top: 2px solid var(--ink);
            border-bottom: 1px solid var(--line);
        }
        .kpi-strip > div { background: #fff; padding: 16px 18px; min-width: 0; }
        @media (min-width: 1024px) { .kpi-strip { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); } }
        .kpi-label { font-size: 13px; font-weight: 500; color: var(--slate); }
        .kpi-value { margin-top: 4px; font-size: 28px; line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
        .kpi-unit { margin-left: 2px; font-size: 15px; font-weight: 600; color: var(--slate); }
        .kpi-note { margin-top: 4px; font-size: 12px; color: var(--muted); }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color .15s, border-color .15s;
        }
        .btn-primary, .brand-button { background: var(--brand); color: #fff; }
        .btn-primary:hover, .brand-button:hover { background: var(--brand-deep); }
        .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); }
        .btn-ghost:hover { background: var(--panel-2); }

        .brand-select {
            min-height: 40px;
            padding: 0 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background-color: #fff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .brand-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(196,30,34,.12); }

        .pdf-doc table th,
        .pdf-doc table td {
            vertical-align: middle !important;
        }
        .pdf-doc .pdf-header-cell {
            position: relative;
            padding-top: 4px !important;
            padding-bottom: 8px !important;
        }
        .pdf-doc .pdf-header-text {
            display: inline-block;
            position: relative;
            top: -2px;
            line-height: 1.2;
        }
        .pdf-doc .pdf-body-text {
            display: inline-block;
            position: relative;
            top: -1px;
            line-height: 1.25;
        }

        /* Print/PDF specific styles */
        .print-only { display: none; }

        /* Canvas specific */
        canvas { touch-action: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); }

        /* 디자인 포인트: ANCORS 표지 모티프(세로 막대 7개) + 레드 사이드바(data-look="a") */
        .brand-bars { display: flex; align-items: flex-end; gap: 6px; height: 56px; color: var(--brand); }
        .brand-bars span { width: 8px; background: currentColor; border-radius: 1px; }

        /* 사이드바·상단 바 */
        .app-sidebar { background: #fff; border-right: 1px solid var(--line); }
        .side-title, .side-user-name { color: var(--ink); }
        .side-sub { color: var(--muted); }
        .side-user { background: var(--panel-2); border: 1px solid var(--line); }
        .side-section { padding: 16px 12px 4px; font-size: 12px; font-weight: 600; color: #a8a29e; }
        .side-foot { border-top: 1px solid var(--line); }
        .nav-item {
            position: relative; width: 100%; display: flex; align-items: center; gap: 12px;
            height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: var(--slate);
            transition: background-color .15s, color .15s;
        }
        .nav-item:hover { background: #f5f5f4; color: var(--ink); }
        .nav-icon { width: 20px; text-align: center; color: #a8a29e; }
        .nav-item.is-active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
        .nav-item.is-active::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
        .nav-item.is-active .nav-icon { color: var(--brand); }
        .app-topbar { background: #fff; border-bottom: 1px solid var(--line); color: var(--ink); }
        .topbar-btn { color: var(--slate); }
        .topbar-btn:hover { background: rgba(0,0,0,.05); }

        /* 대시보드 머리 */
        .dash-hero {
            position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: flex-end;
            justify-content: space-between; gap: 16px 24px; padding: 28px; background: #fff;
            border: 1px solid var(--line); border-radius: 14px;
        }
        .dash-eyebrow { font-size: 13px; font-weight: 600; color: var(--brand); }
        .dash-headline { margin-top: 8px; font-size: 26px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); word-break: keep-all; }
        .dash-headline b { margin: 0 2px; font-size: 44px; font-weight: 800; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
        .dash-headline b.is-zero { color: var(--ink); }
        .dash-sub { margin-top: 10px; font-size: 14px; color: var(--slate); }
        .dash-hero-side { display: flex; align-items: flex-end; gap: 24px; }

        /* 로그인 */
        .login-brand { background: var(--brand); color: #fff; }
        .login-logo { filter: brightness(0) invert(1); }
        .login-kicker { font-size: 14px; font-weight: 600; opacity: .8; }
        .login-title { margin-top: 10px; font-size: 44px; line-height: 1.15; font-weight: 800; letter-spacing: -0.03em; }
        .login-desc { margin-top: 14px; font-size: 16px; opacity: .85; }
        .login-bars { position: absolute; right: 48px; bottom: 0; height: 200px; gap: 14px; color: rgba(255,255,255,.28); }
        .login-bars span { width: 22px; }

        /* a: 레드 사이드바 */
        [data-look="a"] .app-sidebar { background: var(--brand); border-right: 0; }
        [data-look="a"] .side-logo, [data-look="a"] .app-topbar img { filter: brightness(0) invert(1); }
        [data-look="a"] .side-title, [data-look="a"] .side-user-name { color: #fff; }
        [data-look="a"] .side-sub, [data-look="a"] .side-section { color: rgba(255,255,255,.72); }
        [data-look="a"] .side-user { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); }
        [data-look="a"] .side-foot { border-color: rgba(255,255,255,.18); }
        [data-look="a"] .nav-item { color: rgba(255,255,255,.88); }
        [data-look="a"] .nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
        [data-look="a"] .nav-icon { color: rgba(255,255,255,.62); }
        [data-look="a"] .nav-item.is-active { background: #fff; color: var(--brand); }
        [data-look="a"] .nav-item.is-active::before { display: none; }
        [data-look="a"] .app-topbar { background: var(--brand); border-color: var(--brand); color: #fff; }
        [data-look="a"] .topbar-btn { color: #fff; }
        [data-look="a"] .topbar-btn:hover { background: rgba(255,255,255,.12); }

        @media (max-width: 640px) {
            .dash-hero { padding: 22px 18px; }
            .dash-headline { font-size: 20px; }
            .dash-headline b { font-size: 34px; }
            .dash-hero .brand-bars { display: none; }
            .login-title { font-size: 30px; }
        }
        @media (max-width: 768px) {
            .view-header { padding: 16px; }
            .view-title { font-size: 20px; }
        }
    </style>
</head>

        // --- Utils (ISO 8601 Standard) ---
        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        };

        const getFormattedWeek = (dateStr) => {
            const d = new Date(dateStr);
            const year = d.getFullYear();
            const month = d.getMonth() + 1;
            const firstDayOfMonth = new Date(year, month - 1, 1);
            const firstDayOfWeek = firstDayOfMonth.getDay();
            const offsetDate = d.getDate() + firstDayOfWeek - 1;
            const weekOfMonth = Math.floor(offsetDate / 7) + 1;
            return `${year}년 ${month}월 ${weekOfMonth}주차`;
        };

        const getLocalDateInputValue = () => {
            const now = new Date();
            const offsetMs = now.getTimezoneOffset() * 60000;
            return new Date(now.getTime() - offsetMs).toISOString().split('T')[0];
        };

        const hashPassword = async (plainText) => {
            const msgUint8 = new TextEncoder().encode(String(plainText || ''));
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            return Array.from(new Uint8Array(hashBuffer))
                .map((b) => b.toString(16).padStart(2, '0'))
                .join('');
        };

        const verifyPassword = async (inputPassword, account) => {
            const normalizedInput = String(inputPassword ?? '').trim();
            if (account?.passwordHash) {
                const hashed = await hashPassword(normalizedInput);
                return hashed === account.passwordHash;
            }
            // Legacy fallback for old documents (plain password)
            const legacyCandidates = [
                account?.password,
                account?.pw,
                account?.pass
            ];
            return legacyCandidates.some((v) => {
                if (v === undefined || v === null) return false;
                return normalizedInput === String(v).trim();
            });
        };

        // FIXED: ISO 8601 compliant week date range calculator
        const getWeekDetails = (year, weekNo) => {
            // ISO Week 1 is the week with the first Thursday of the year (Jan 4th is always in Week 1)
            const jan4 = new Date(year, 0, 4);
            const day = jan4.getDay() || 7; // Mon=1, Sun=7
            const week1Start = new Date(jan4);
            week1Start.setDate(jan4.getDate() - day + 1); // Start of ISO Week 1 (Monday)

            // Calculate start date of the requested week
            const start = new Date(week1Start);
            start.setDate(week1Start.getDate() + (weekNo - 1) * 7);
            
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            
            // Format dates
            const fmt = (date) => `${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
            
            // Determine month for label (based on Thursday of the week to handle month overlap)
            const thursday = new Date(start);
            thursday.setDate(start.getDate() + 3);
            const month = thursday.getMonth() + 1;
            
            // Simple visual "Week of Month" for the label
            const weekOfMonth = Math.ceil(start.getDate() / 7);

            return {
                startYear: start.getFullYear(),
                label: `${year}년 ${month}월 ${weekOfMonth}주차 (${fmt(start)}~${fmt(end)})`,
                value: `${year}-W${weekNo}`
            };
        };

        // --- Error Boundary ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center h-screen bg-red-50 text-red-800 p-8">
                            <i className="fas fa-exclamation-triangle text-6xl mb-4"></i>
                            <h1 className="text-3xl font-bold mb-2">시스템 오류 발생</h1>
                            <p className="mb-6 text-center max-w-md">일시적인 오류가 발생했습니다.<br/>(Error: {this.state.error.message})</p>
                            <button onClick={() => window.location.reload()} className="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition shadow-lg">재시작</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Helper Components ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, []);
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            return (
                <div className={`fixed top-4 left-1/2 -translate-x-1/2 sm:left-auto sm:translate-x-0 sm:right-5 ${bgClass} text-white px-4 sm:px-5 py-3 rounded-lg shadow-lg z-50 flex items-center text-sm font-medium animate-bounce-in max-w-[calc(100vw-1.5rem)]`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} mr-3`}></i>
                    {message}
                </div>
            );
        };

        // --- Chart Components ---
        const SimpleBarChart = ({ data, highlightIndex = -1 }) => {
            const maxVal = Math.max(1, ...data.map(d => d.value));
            const TRACK = 160; // 막대 최대 높이(px)
            return (
                <div>
                    <div className="flex items-end gap-1.5 sm:gap-3 border-b border-slate-300" style={{ height: TRACK + 24 }}>
                        {data.map((d, i) => (
                            <div key={i} className="flex-1 min-w-0 flex flex-col items-center justify-end">
                                <span className={`text-xs tnum mb-1 ${d.value > 0 ? 'font-bold text-slate-800' : 'text-slate-300'}`}>{d.value}</span>
                                <div className={`w-full max-w-[36px] rounded-t-sm ${i === highlightIndex ? 'bg-blue-600' : 'bg-blue-200'}`} style={{ height: Math.round(d.value / maxVal * TRACK) }}></div>
                            </div>
                        ))}
                    </div>
                    <div className="flex gap-1.5 sm:gap-3 mt-2">
                        {data.map((d, i) => (
                            <span key={i} className={`flex-1 min-w-0 text-center text-[11px] sm:text-xs whitespace-nowrap ${i === highlightIndex ? 'font-bold text-slate-900' : 'text-slate-500'}`}>{d.label.replace('월', '')}<span className="hidden sm:inline">월</span></span>
                        ))}
                    </div>
                </div>
            );
        };

        const HBarList = ({ data, emptyMessage }) => {
            if (!data.length) return <div className="py-8 text-center text-sm text-slate-500">{emptyMessage}</div>;
            const maxVal = Math.max(...data.map(d => d.value));
            return (
                <div className="space-y-3">
                    {data.map((d, i) => (
                        <div key={d.label} className="grid grid-cols-[minmax(0,8rem)_1fr_2.5rem] items-center gap-3 text-sm">
                            <span className="truncate text-slate-700">{d.label}</span>
                            <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${i === 0 ? 'bg-blue-600' : 'bg-blue-200'}`} style={{ width: `${d.value / maxVal * 100}%` }}></div>
                            </div>
                            <span className="text-right font-bold tnum text-slate-800">{d.value}</span>
                        </div>
                    ))}
                </div>
            );
        };

        // ANCORS 표지 모티프: 높이가 커지는 세로 막대 7개
        const BrandBars = ({ className = '' }) => (
            <div className={`brand-bars ${className}`} aria-hidden="true">
                {[30, 42, 54, 66, 78, 90, 100].map((h, i) => <span key={i} style={{ height: `${h}%` }}></span>)}
            </div>
        );

        const RateMeter = ({ rate, note }) => (
            <div>
                <div className="flex items-baseline gap-1">
                    <span className="text-4xl font-bold tnum text-slate-900">{rate}</span>
                    <span className="text-lg font-semibold text-slate-500">%</span>
                </div>
                <div className="relative mt-4 h-3 bg-slate-100 rounded-full">
                    <div className={`h-full rounded-full ${rate >= 90 ? 'bg-emerald-600' : rate >= 70 ? 'bg-amber-500' : 'bg-red-600'}`} style={{ width: `${rate}%` }}></div>
                    <div className="absolute -top-1 -bottom-1 w-px bg-slate-500" style={{ left: '90%' }}></div>
                </div>
                <div className="relative mt-1.5 h-4 text-xs text-slate-500 tnum">
                    <span className="absolute left-0">0</span>
                    <span className="absolute -translate-x-1/2" style={{ left: '90%' }}>90</span>
                </div>
                <p className="mt-4 text-sm text-slate-600 leading-relaxed">{note}</p>
            </div>
        );

        // --- Signature Pad Component ---
        const SignatureModal = ({ isOpen, onClose, onSave, signerName }) => {
            const canvasRef = useRef(null);
            const isDrawing = useRef(false);
            const pointsRef = useRef([]);
            const MIN_MOVE_DISTANCE = 2.6;
            const STROKE_SMOOTHING = 0.42;
            const [hasSigned, setHasSigned] = useState(false);

            useEffect(() => {
                if (isOpen && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = 'black';
                    ctx.lineJoin = 'round';
                    
                    setTimeout(() => {
                        const rect = canvas.getBoundingClientRect();
                        canvas.width = rect.width;
                        canvas.height = rect.height;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }, 50);
                    
                    pointsRef.current = [];
                    setHasSigned(false);
                }
            }, [isOpen]);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const distance = (a, b) => {
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                return Math.sqrt(dx * dx + dy * dy);
            };

            const midPoint = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

            const startDrawing = (e) => {
                e.preventDefault();
                isDrawing.current = true;
                const { x, y } = getPos(e);
                pointsRef.current = [{ x, y }];
                const ctx = canvasRef.current.getContext('2d');

                // tap 입력도 보이도록 시작점 표시
                ctx.beginPath();
                ctx.arc(x, y, ctx.lineWidth * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fill();
                setHasSigned(true);
            };

            const draw = (e) => {
                if (!isDrawing.current) return;
                e.preventDefault();

                const { x, y } = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                const prev = pointsRef.current[pointsRef.current.length - 1];

                let current = { x, y };
                if (prev) {
                    current = {
                        x: prev.x + (x - prev.x) * STROKE_SMOOTHING,
                        y: prev.y + (y - prev.y) * STROKE_SMOOTHING,
                    };
                }

                if (prev && distance(prev, current) < MIN_MOVE_DISTANCE) return;

                pointsRef.current.push(current);

                if (pointsRef.current.length < 3) {
                    ctx.beginPath();
                    ctx.moveTo(prev.x, prev.y);
                    ctx.lineTo(current.x, current.y);
                    ctx.stroke();
                    return;
                }

                const p0 = pointsRef.current[pointsRef.current.length - 3];
                const p1 = pointsRef.current[pointsRef.current.length - 2];
                const p2 = pointsRef.current[pointsRef.current.length - 1];
                const m1 = midPoint(p0, p1);
                const m2 = midPoint(p1, p2);

                ctx.beginPath();
                ctx.moveTo(m1.x, m1.y);
                ctx.quadraticCurveTo(p1.x, p1.y, m2.x, m2.y);
                ctx.stroke();
                setHasSigned(true);
            };

            const stopDrawing = () => {
                isDrawing.current = false;
                pointsRef.current = [];
            };

            const handleSave = () => {
                if (!hasSigned) return;
                const dataUrl = canvasRef.current.toDataURL();
                onSave(dataUrl);
                onClose();
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pointsRef.current = [];

                                onMouseMove={draw}
                                onMouseUp={stopDrawing}
                                onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing}
                                onTouchMove={draw}
                                onTouchEnd={stopDrawing}
                            />

                            </div>
                        </div>
                    </div>
                </div>
            );

            return ReactDOM.createPortal(modalUi, document.body);
        };

        // --- Hidden PDF Generator (Auto Download - Fixed Layout) ---
        const PdfHiddenGenerator = ({ tbm, onComplete }) => {
            const pageRefs = useRef([]);
            pageRefs.current = [];

            const chunkArray = (items, chunkSize) => {
                const source = Array.isArray(items) ? items : [];
                if (source.length === 0) return [[]];
                const chunks = [];
                for (let i = 0; i < source.length; i += chunkSize) {
                    chunks.push(source.slice(i, i + chunkSize));
                }
                return chunks;
            };

            const riskRows = (tbm.risks && tbm.risks.length > 0) ? tbm.risks : [];
            const safetyChecks = ((tbm.safetyActionChecks && tbm.safetyActionChecks.length > 0)
                ? tbm.safetyActionChecks
                : (tbm.risks || []).filter(r => (r.factor || '').trim() !== '').map(r => ({
                    risk: r.factor,
                    result: r.result || 'yes',
                    action: r.action || ''
                }))
            );
            const attendeePairs = [];
            const attendees = tbm.attendees || [];
            for (let i = 0; i < attendees.length; i += 2) {
                attendeePairs.push([attendees[i], attendees[i + 1]]);
            }

            const riskChunks = chunkArray(riskRows, 8);

            useEffect(() => {

                    const pageNodes = pageRefs.current.filter(Boolean);

                            await document.fonts.ready;
                        }
                        await new Promise(resolve => setTimeout(resolve, 500));
                        const pdf = new jsPDF('p', 'mm', 'a4');
                        const pageWidth = pdf.internal.pageSize.getWidth();
                        const pageHeight = pdf.internal.pageSize.getHeight();

                        for (let i = 0; i < pageNodes.length; i += 1) {
                            const node = pageNodes[i];
                            const canvas = await html2canvas(node, {
                                scale: 2,
                                useCORS: true,
                                backgroundColor: '#ffffff',
                                width: node.scrollWidth,
                                height: node.scrollHeight,
                                windowWidth: node.scrollWidth,
                                windowHeight: node.scrollHeight
                            });
                            const imgData = canvas.toDataURL('image/jpeg', 0.92);
                            if (i > 0) pdf.addPage();
                            pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                        }
                        const totalPages = pdf.getNumberOfPages();

                        onComplete({ ok: true });

                        onComplete({ ok: false, error: e });

                    }

                                                <td className="border border-black whitespace-pre-wrap" style={{verticalAlign: 'middle', padding: '6px 8px', lineHeight: 1.35, overflowWrap: 'anywhere'}}><span className="pdf-body-text">{r.measure}</span></td>

                    {safetyChunks.slice(1).map((chunk, chunkIdx) => (
                        <div

                            ref={(node) => { pageRefs.current[riskChunks.length + chunkIdx] = node; }}

                        >
                            <h1 className="text-2xl font-bold text-center mb-8 pb-4 border-b-2 border-black"><span style={{display:'block',fontSize:'0.46em',fontWeight:700,letterSpacing:'0.28em',marginBottom:'6px'}}>{COMPANY_NAME}</span>Tool Box Meeting 회의록</h1>
                            {chunkIdx === 0 && (
                                <div className="mb-6">
                                    <h4 className="font-bold mb-2 border-l-4 border-black pl-2">3. 작업 전 일일 안전점검 시행 결과</h4>
                                    <div className="border border-black p-2 min-h-[50px] whitespace-pre-wrap">
                                        {tbm.dailyCheckResult || '특이사항 없음'}
                                    </div>
                                </div>
                            )}

                            {chunkIdx === 0 && tbm.photoUrl && (
                                <div className="mb-6">
                                    <h4 className="font-bold mb-2 border-l-4 border-black pl-2">4. TBM 활동 사진</h4>
                                    <div className="border border-black p-2 flex justify-center">
                                        <img src={tbm.photoUrl} alt="활동사진" className="max-h-60 object-contain" />
                                    </div>
                                </div>
                            )}

                            <div className="break-inside-avoid">
                                <h4 className="font-bold mb-2 border-l-4 border-black pl-2">5. 참석자 명단 (총 {tbm.attendees?.length || 0}명){chunkIdx > 0 ? ' - 계속' : ''}</h4>
                                <table className="w-full border-collapse border-2 border-black table-fixed text-sm" style={{ width: '100%', tableLayout: 'fixed', borderCollapse: 'collapse', borderSpacing: 0 }}>
                                    <thead>
                                        <tr className="bg-gray-100">
                                            <th className="pdf-header-cell border border-black text-center" style={{width: '25%', padding: '6px 4px', lineHeight: 1.3}}><span className="pdf-header-text">이름</span></th>
                                            <th className="pdf-header-cell border border-black text-center" style={{width: '25%', padding: '6px 4px', lineHeight: 1.3}}><span className="pdf-header-text">서명</span></th>
                                            <th className="pdf-header-cell border border-black text-center" style={{width: '25%', padding: '6px 4px', lineHeight: 1.3}}><span className="pdf-header-text">이름</span></th>
                                            <th className="pdf-header-cell border border-black text-center" style={{width: '25%', padding: '6px 4px', lineHeight: 1.3}}><span className="pdf-header-text">서명</span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {chunk[0] ? chunk.map((pair, i) => {
                                            const left = pair[0];
                                            const right = pair[1];
                                            return (
                                                <tr key={i}>
                                                    <td className="border border-black h-16 align-middle text-center font-bold whitespace-pre-wrap break-words" style={{padding: '6px 8px', verticalAlign: 'middle', lineHeight: 1.35}}>{left?.name || '-'}</td>
                                                    <td className="border border-black h-16 align-middle text-center" style={{padding: '4px', verticalAlign: 'middle', lineHeight: 1.35}}>
                                                        {left?.isLeader ? (
                                                            left?.signatureUrl
                                                                ? <img src={left.signatureUrl} alt="서명" className="max-h-12 max-w-full object-contain mx-auto" />
                                                                : <span className="text-red-500 text-xs font-bold">(리더 미서명)</span>
                                                        ) : (
                                                            <span className="text-gray-500 text-xs">서명 생략(대표자 확인)</span>
                                                        )}
                                                    </td>
                                                    <td className="border border-black h-16 align-middle text-center font-bold whitespace-pre-wrap break-words" style={{padding: '6px 8px', verticalAlign: 'middle', lineHeight: 1.35}}>{right?.name || ''}</td>
                                                    <td className="border border-black h-16 align-middle text-center" style={{padding: '4px', verticalAlign: 'middle', lineHeight: 1.35}}>
                                                        {right ? (
                                                            right?.isLeader
                                                                ? (right?.signatureUrl
                                                                    ? <img src={right.signatureUrl} alt="서명" className="max-h-12 max-w-full object-contain mx-auto" />
                                                                    : <span className="text-red-500 text-xs font-bold">(리더 미서명)</span>)
                                                                : <span className="text-gray-500 text-xs">서명 생략(대표자 확인)</span>
                                                        ) : ''}
                                                    </td>
                                                </tr>
                                            );
                                        }) : (
                                            <tr>
                                                <td colSpan="4" className="border border-black text-center text-gray-400" style={{padding: '12px 8px', lineHeight: 1.35}}>
                                                    참석자 기록 없음
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const SectionHero = ({ chip, title, subtitle, actions }) => (
            <div className="view-header">
                <div className="view-header-primary">
                    {chip && <div className="hero-chip">{chip}</div>}
                    <h2 className="view-title">{title}</h2>
                    {subtitle && <p className="view-subtitle">{subtitle}</p>}
                </div>
                {actions && <div className="flex flex-wrap items-center gap-2">{actions}</div>}
            </div>
        );

        const WeeklyStatusPanel = ({ accounts, tbms, currentYear }) => {
            const [selectedWeek, setSelectedWeek] = useState(`${currentYear}-W${getWeekNumber(new Date())}`);
            
            useEffect(() => {
                setSelectedWeek(`${currentYear}-W${getWeekNumber(new Date())}`);
            }, [currentYear]);

            const weekOptions = useMemo(() => {
                const weeks = [];
                for(let i=1; i<=53; i++) {
                    const details = getWeekDetails(parseInt(currentYear), i);
                    if (details.startYear > parseInt(currentYear)) continue;
                    weeks.push(details);
                }
                return weeks;
            }, [currentYear]);

            const statusData = useMemo(() => {
                // Filter masters and Sort alphabetically (Ga-Na-Da)
                const deptList = accounts
                    .filter(a => a.role !== 'master')
                    .map(a => a.department)
                    .sort((a, b) => a.localeCompare(b, 'ko')); // Added sorting here for explicit order
                
                const selectedWeekNum = parseInt(selectedWeek.split('-W')[1]);
                
                const result = deptList.map(dept => {
                    const submitted = tbms.find(t => {
                        if (t.department !== dept) return false;
                        if (!t.date.startsWith(currentYear)) return false;
                        return getWeekNumber(new Date(t.date)) === selectedWeekNum;
                    });
                    return { department: dept, submitted: !!submitted, data: submitted };
                });
                return result;
            }, [accounts, tbms, selectedWeek, currentYear]);

            const doneCount = statusData.filter(s => s.submitted).length;
            return (
                <div className="mb-6">
                    <div className="flex flex-wrap items-end justify-between gap-3 mb-3">
                        <div>
                            <h3 className="text-[15px] font-bold text-slate-900">주간 부서별 제출 현황</h3>
                            <p className="text-sm text-slate-500 mt-0.5 tnum">제출 {doneCount} / {statusData.length}개 부서</p>
                        </div>
                        <select className="brand-select w-full sm:w-auto" value={selectedWeek} onChange={e=>setSelectedWeek(e.target.value)}>
                            {weekOptions.map(w => <option key={w.value} value={w.value}>{w.label}</option>)}
                        </select>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 border-t border-l border-slate-200">
                        {statusData.map(s => (
                            <div key={s.department} className="px-3 py-2.5 flex items-center justify-between gap-2 min-w-0 border-r border-b border-slate-200 bg-white">
                                <span className="text-sm font-medium text-slate-800 truncate">{s.department}</span>
                                <span className={`shrink-0 inline-flex items-center gap-1.5 text-xs font-bold ${s.submitted ? 'text-emerald-700' : 'text-red-700'}`}>
                                    <span className={`w-1.5 h-1.5 rounded-full ${s.submitted ? 'bg-emerald-600' : 'bg-red-600'}`}></span>{s.submitted ? '제출' : '미제출'}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Settings View (Master Only) ---
        const SettingsView = ({ availableYears, setAvailableYears }) => {
            const [newYear, setNewYear] = useState('');

            const handleAddYear = async () => {
                if (!newYear || availableYears.includes(newYear)) return;
                const updated = [...availableYears, newYear].sort();
                setAvailableYears(updated);
                await setDoc(doc(db, "system_settings", "config"), { years: updated });
                setNewYear('');
            };

            const handleRemoveYear = async (year) => {
                if (availableYears.length <= 1) return alert("최소 1개의 연도는 필요합니다.");
                const updated = availableYears.filter(y => y !== year);
                setAvailableYears(updated);
                await setDoc(doc(db, "system_settings", "config"), { years: updated });
            };

            return (
                <div className="tone-panel rounded-xl animate-fade-in-up overflow-hidden">
                    <SectionHero chip={<><i className="fas fa-sliders"></i> 시스템 관리</>} title="시스템 설정" subtitle="조회 연도와 기본 운영 값을 관리합니다" />
                    <div className="p-6 sm:p-8">
                    <div className="mb-8">
                        <h3 className="font-bold text-[15px] mb-3 text-slate-900">조회 연도 관리</h3>
                        <div className="flex gap-2 mb-4">
                            <input type="number" className="input-field w-48" placeholder="예: 2027" value={newYear} onChange={e => setNewYear(e.target.value)} />
                            <button onClick={handleAddYear} className="btn btn-primary">추가</button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {availableYears.map(year => (
                                <div key={year} className="bg-white px-3 h-9 rounded-full flex items-center gap-2 border border-slate-200">
                                    <span className="font-bold text-slate-800">{year}년</span>
                                    <button onClick={() => handleRemoveYear(year)} className="text-rose-400 hover:text-rose-600"><i className="fas fa-times-circle"></i></button>
                                </div>
                            ))}
                        </div>
                        <p className="muted-note mt-2">* 이곳에서 설정한 연도만 대시보드와 이력 조회 필터에 표시됩니다.</p>
                    </div>
                    </div>
                </div>
            );
        };

        // --- View Components ---
        const LoginView = ({ loginId, setLoginId, loginPw, setLoginPw, handleLogin, saveId, setSaveId, loading }) => (
            <div className="min-h-[100dvh] grid grid-rows-[auto_1fr] lg:grid-rows-1 lg:grid-cols-[1.1fr_1fr]">
                <div className="login-brand relative overflow-hidden px-6 py-7 lg:p-14 flex flex-col lg:justify-between">
                    <img src={LOGO_RED} alt={COMPANY_NAME} className="login-logo h-5 lg:h-7 self-start" />
                    <div className="mt-6 lg:mt-0 lg:mb-40 relative z-10">
                        <div className="login-kicker">{COMPANY_NAME} 안전 운영</div>
                        <h1 className="login-title">스마트 TBM</h1>
                        <p className="login-desc hidden lg:block">{COMPANY_NAME} 현장 작업팀과 관리자를 위한 일일 TBM 업무 흐름</p>
                    </div>
                    <BrandBars className="login-bars hidden lg:flex" />
                </div>
                <div className="flex items-start lg:items-center justify-center px-4 py-8 lg:py-10">
                    <div className="w-full max-w-[400px]">
                        <h2 className="text-[22px] font-bold tracking-tight text-slate-900">로그인</h2>
                        <p className="mt-1 text-sm text-slate-500">부서 계정으로 로그인하세요.</p>
                        <form onSubmit={handleLogin} className="mt-6 space-y-5">
                            <div>
                                <label htmlFor="loginId" className="label-text">아이디 (부서코드)</label>
                                <input id="loginId" type="text" autoComplete="username" className="input-field" placeholder="아이디를 입력하세요" value={loginId} onChange={e => setLoginId(e.target.value)} required />
                            </div>
                            <div>
                                <label htmlFor="loginPw" className="label-text">비밀번호</label>
                                <input id="loginPw" type="password" autoComplete="current-password" className="input-field" placeholder="비밀번호" value={loginPw} onChange={e => setLoginPw(e.target.value)} required />
                            </div>
                            <label htmlFor="saveId" className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                                <input id="saveId" type="checkbox" className="w-4 h-4" checked={saveId} onChange={e => setSaveId(e.target.checked)} />
                                아이디 저장
                            </label>
                            <button type="submit" className="btn btn-primary w-full !min-h-[48px] text-[15px]">{loading ? <i className="fas fa-spinner fa-spin"></i> : '로그인'}</button>
                        </form>
                    </div>
                </div>
            </div>
        );

        const Sidebar = ({ user, view, setView, handleLogout, mobileMenuOpen, setMobileMenuOpen }) => {
            const items = [
                ['dashboard', 'fa-chart-simple', '대시보드'],
                ['write', 'fa-pen-to-square', 'TBM 등록'],
                ['today', 'fa-calendar-day', '오늘 작업'],
                ['list', 'fa-list-ul', 'TBM 이력조회'],
                ['risks', 'fa-triangle-exclamation', '미조치 위험'],
            ];
            const adminItems = [
                ['admin', 'fa-users-gear', '계정/권한 관리'],
                ['settings', 'fa-gear', '시스템 설정'],
            ];
            const navBtn = ([key, icon, label]) => {
                const active = view === key;
                return (
                    <button key={key} onClick={() => { setView(key); setMobileMenuOpen(false); }} aria-current={active ? 'page' : undefined} className={`nav-item ${active ? 'is-active' : ''}`}>
                        <i className={`fas ${icon} nav-icon`}></i>{label}
                    </button>
                );
            };
            return (
                <aside className={`app-sidebar w-64 h-[100dvh] fixed left-0 top-0 flex flex-col z-40 transform transition-transform duration-300 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
                    <div className="px-5 pt-6 pb-5">
                        <img src={LOGO_RED} alt={COMPANY_NAME} className="side-logo h-[18px]" />
                        <div className="side-title mt-3 text-[17px] font-bold tracking-tight">스마트 TBM</div>
                        <div className="side-sub text-xs mt-0.5">통합 안전관리 시스템</div>
                    </div>
                    <div className="side-user mx-3 mb-2 px-3 py-2.5 rounded-lg">
                        <div className="side-user-name text-sm font-semibold truncate">{user.department}</div>
                        <div className="side-sub text-xs">{user.role === 'master' ? '관리자' : '사용자'}</div>
                    </div>
                    <nav className="flex-1 px-3 py-2 space-y-0.5 overflow-y-auto no-scrollbar">
                        {items.map(navBtn)}
                        {user.role === 'master' && (
                            <>
                                <div className="side-section">관리</div>
                                {adminItems.map(navBtn)}
                            </>
                        )}
                    </nav>
                    <div className="side-foot p-3">
                        <button onClick={() => { setMobileMenuOpen(false); handleLogout(); }} className="nav-item">
                            <i className="fas fa-arrow-right-from-bracket nav-icon"></i>로그아웃
                        </button>
                    </div>
                </aside>
            );
        };

        const DashboardView = ({ stats, tbms, currentYear, setCurrentYear, allTbms, availableYears }) => {
            const riskCategoryData = useMemo(() => {
                const risks = {};
                tbms.forEach(tbm => tbm.risks?.forEach(r => {
                    const key = (r.factor || "기타").split(' ')[0] || "기타";
                    risks[key] = (risks[key] || 0) + 1;
                }));
                return Object.entries(risks).map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value).slice(0, 6);
            }, [tbms]);

            const dashboardActions = useMemo(() => {
                const currentYearTbms = tbms.filter(t => String(t.date || '').startsWith(currentYear));
                const departments = Array.from(new Set(currentYearTbms.map(t => t.department).filter(Boolean)));
                const submittedDeptCount = departments.length;
                const noActionRiskCount = currentYearTbms.reduce((acc, tbm) => acc + (tbm.risks || []).filter(r => (r.result || 'yes') === 'no').length, 0);
                const todayStr = getLocalDateInputValue();
                const todayCount = currentYearTbms.filter(t => t.date === todayStr).length;
                const now = new Date();
                const day = now.getDay() || 7;
                const weekStart = new Date(now);
                weekStart.setHours(0, 0, 0, 0);
                weekStart.setDate(now.getDate() - day + 1);
                const weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 7);
                const weekCount = currentYearTbms.filter((tbm) => {
                    const d = new Date(tbm.date);
                    return d >= weekStart && d < weekEnd;
                }).length;
                const latestUpdated = [...currentYearTbms]
                    .filter(t => t.updatedAt)
                    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];

                return {
                    submittedDeptCount,
                    noActionRiskCount,
                    todayCount,
                    weekCount,
                    latestUpdated
                };
            }, [tbms, currentYear]);

            // NOTE: deptRankingData Removed as per request

            // New: Calculate Safety Score based on Risk Assessment Rate
            const safetyScore = useMemo(() => {
                if (stats.total === 0) return 0;
                return Math.round((stats.safeCount / stats.total) * 100);
            }, [stats]);

            const getScoreMessage = (score) => {
                if (stats.total === 0) return "데이터가 수집되지 않았습니다.";
                if (score >= 90) return "훌륭합니다! 현재 최고 수준의 안전 관리가 이루어지고 있습니다.";
                if (score >= 70) return "양호합니다. 지속적인 위험 요인 발굴과 관심이 필요합니다.";
                return "주의가 필요합니다. 위험성 평가 실시율을 높이고 안전 조치를 강화해주세요.";
            };

            const participantCount = tbms.reduce((acc, cur) => acc + (cur.attendees?.length || 0), 0);
            const noAction = dashboardActions.noActionRiskCount;
            const latest = dashboardActions.latestUpdated;
            const isCurrentYear = String(new Date().getFullYear()) === String(currentYear);

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="dash-hero">
                        <div className="min-w-0 relative z-10">
                            <div className="dash-eyebrow tnum">SHE 경영 대시보드 · {new Date().toLocaleDateString()} 기준</div>
                            <h2 className="dash-headline">
                                오늘 TBM <b className={dashboardActions.todayCount ? '' : 'is-zero'}>{dashboardActions.todayCount}</b>건,
                                미조치 위험 <b className={noAction ? '' : 'is-zero'}>{noAction}</b>건
                            </h2>
                            <p className="dash-sub">
                                {latest
                                    ? <>최근 수정 <b className="font-semibold">{latest.workName || '-'}</b> · {latest.department} · {new Date(latest.updatedAt).toLocaleString()}</>
                                    : '최근 수정 이력이 없습니다.'}
                            </p>
                        </div>
                        <div className="dash-hero-side relative z-10">
                            <select className="brand-select" value={currentYear} onChange={(e) => setCurrentYear(e.target.value)}>
                                {availableYears.map(y => <option key={y} value={y}>{y}년</option>)}
                            </select>
                            <BrandBars />
                        </div>
                    </div>

                    <div className="kpi-strip" style={{ '--cols': 4 }}>
                        <div><div className="kpi-label">{currentYear}년 TBM</div><div className="kpi-value">{stats.total}<span className="kpi-unit">회</span></div><div className="kpi-note">누적 등록 건수</div></div>
                        <div><div className="kpi-label">이번주 등록</div><div className="kpi-value">{dashboardActions.weekCount}<span className="kpi-unit">건</span></div><div className="kpi-note">월요일부터 집계</div></div>
                        <div><div className="kpi-label">참여 작업자</div><div className="kpi-value">{participantCount}<span className="kpi-unit">명</span></div><div className="kpi-note">참석자 누적 합계</div></div>
                        <div><div className="kpi-label">위험성 평가 실시율</div><div className="kpi-value">{safetyScore}<span className="kpi-unit">%</span></div><div className="kpi-note tnum">{stats.safeCount} / {stats.total}건 평가</div></div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        <div className="chart-panel xl:col-span-2">
                            <h3 className="chart-title">월별 TBM 활동 추이</h3>
                            <SimpleBarChart data={stats.monthlyData} highlightIndex={isCurrentYear ? new Date().getMonth() : -1} />
                        </div>
                        <div className="chart-panel">
                            <h3 className="chart-title">위험성 평가 실시율</h3>
                            <RateMeter rate={safetyScore} note={getScoreMessage(safetyScore)} />
                        </div>
                    </div>

                    <div className="chart-panel">
                        <h3 className="chart-title">위험 요인 유형 <span className="ml-1 text-sm font-normal text-slate-500">위험요인 첫 단어 기준 · 상위 6개</span></h3>
                        <HBarList data={riskCategoryData} emptyMessage="등록된 위험요인이 없습니다." />
                    </div>
                </div>
            );
        };

        const ActionQueueView = ({ title, subtitle, items, emptyMessage, accent = 'sky', onEdit, onPdfDownload, user, setView }) => (
            <div className="tone-panel overflow-hidden animate-fade-in-up">
                <SectionHero title={title} subtitle={subtitle} actions={<button onClick={() => setView('write')} className="btn btn-primary"><i className="fas fa-plus"></i>신규 등록</button>} />
                {items.length === 0 ? (
                    <div className="px-6 py-14 text-center text-sm text-slate-500">{emptyMessage}</div>
                ) : (
                    <ul className="divide-y divide-slate-200">
                        {items.map((tbm) => (
                            <li key={tbm.id || tbm.date} className="px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-start gap-3">
                                <div className="flex-1 min-w-0">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${accent === 'rose' ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-700'}`}>{tbm.badge || '확인 필요'}</span>
                                        <span className="text-xs text-slate-500 tnum">{tbm.department} · {tbm.date}</span>
                                    </div>
                                    <div className="mt-1.5 text-[15px] font-semibold text-slate-900">{tbm.workName || '작업명 없음'}</div>
                                    <div className="mt-0.5 text-sm text-slate-500">리더 {tbm.leader || '-'}</div>
                                    {tbm.meta && <div className="mt-2 text-sm text-slate-700 whitespace-pre-wrap">{tbm.meta}</div>}
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    {tbm.id && <button onClick={() => onEdit(tbm)} className="btn btn-ghost">수정</button>}
                                    {!tbm.id && <button onClick={() => setView('write')} className="btn btn-ghost">이어쓰기</button>}
                                    {user?.role === 'master' && tbm.id && <button onClick={() => onPdfDownload(tbm)} className="btn btn-ghost"><i className="fas fa-file-pdf text-slate-400"></i>PDF</button>}
                                </div>
                            </li>
                        ))}
                    </ul>
                )}
            </div>
        );

        const ListView = ({ user, myTbms, setView, accounts, allTbms, currentYear, setCurrentYear, onEdit, onDelete, onPdfDownload, availableYears }) => {
            const [searchKeyword, setSearchKeyword] = useState('');
            const [quickPeriod, setQuickPeriod] = useState('year');
            const [selectedTbm, setSelectedTbm] = useState(null);

            const periodFilteredTbms = useMemo(() => {
                if (quickPeriod === 'year') return myTbms;
                const now = new Date();
                const todayStr = getLocalDateInputValue();
                if (quickPeriod === 'today') {
                    return myTbms.filter((tbm) => tbm.date === todayStr);
                }
                if (quickPeriod === 'month') {
                    const month = now.getMonth();
                    const year = now.getFullYear();
                    return myTbms.filter((tbm) => {
                        const d = new Date(tbm.date);
                        return d.getFullYear() === year && d.getMonth() === month;
                    });
                }
                if (quickPeriod === 'week') {
                    const day = now.getDay() || 7;
                    const weekStart = new Date(now);
                    weekStart.setHours(0, 0, 0, 0);
                    weekStart.setDate(now.getDate() - day + 1);
                    const weekEnd = new Date(weekStart);
                    weekEnd.setDate(weekStart.getDate() + 7);
                    return myTbms.filter((tbm) => {
                        const d = new Date(tbm.date);
                        return d >= weekStart && d < weekEnd;
                    });
                }
                return myTbms;
            }, [myTbms, quickPeriod]);

            const filteredTbms = useMemo(() => {
                const q = searchKeyword.trim().toLowerCase();
                if (!q) return periodFilteredTbms;
                return periodFilteredTbms.filter((tbm) =>
                    String(tbm.workName || '').toLowerCase().includes(q) ||
                    String(tbm.leader || '').toLowerCase().includes(q) ||
                    String(tbm.createdBy || '').toLowerCase().includes(q) ||
                    String(tbm.department || '').toLowerCase().includes(q)
                );
            }, [periodFilteredTbms, searchKeyword]);

            return (
                <div className="tone-panel overflow-hidden animate-fade-in-up">
                    <SectionHero
                        title="TBM 이력 조회"
                        subtitle={user.role === 'master' ? '전사 통합 관리 모드' : `${user.department} 활동 내역`}
                        actions={<>
                            <select className="brand-select" value={currentYear} onChange={(e) => setCurrentYear(e.target.value)}>
                                {availableYears.map(y => <option key={y} value={y}>{y}년</option>)}
                            </select>
                            <button onClick={() => setView('write')} className="btn btn-primary"><i className="fas fa-plus"></i>신규 등록</button>
                        </>}
                    />

                    {/* Weekly Status Panel (Sorted by Dept Name) */}
                    {user.role === 'master' && (
                        <div className="px-6 pt-6">
                            <WeeklyStatusPanel accounts={accounts} tbms={allTbms} currentYear={currentYear} />
                        </div>
                    )}

                    <div className="px-4 sm:px-6 pt-5 pb-4">
                        <div className="flex flex-wrap items-center gap-2 mb-3">
                            <button onClick={() => setQuickPeriod('today')} className={`h-8 px-3 text-[13px] font-medium rounded-full border ${quickPeriod === 'today' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>오늘</button>
                            <button onClick={() => setQuickPeriod('week')} className={`h-8 px-3 text-[13px] font-medium rounded-full border ${quickPeriod === 'week' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>이번주</button>
                            <button onClick={() => setQuickPeriod('month')} className={`h-8 px-3 text-[13px] font-medium rounded-full border ${quickPeriod === 'month' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>이번달</button>
                            <button onClick={() => setQuickPeriod('year')} className={`h-8 px-3 text-[13px] font-medium rounded-full border ${quickPeriod === 'year' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>{currentYear}년</button>
                            <span className="muted-note ml-auto">총 {filteredTbms.length}건</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <i className="fas fa-search text-gray-400"></i>
                            <input
                                type="text"
                                className="input-field"
                                placeholder="작업명, 리더명, 부서명 검색"
                                value={searchKeyword}
                                onChange={(e) => setSearchKeyword(e.target.value)}
                            />
                            {searchKeyword && (
                                <button onClick={() => setSearchKeyword('')} className="shrink-0 px-3 py-2 text-sm border border-gray-300 rounded-lg bg-white text-gray-600 hover:bg-gray-50">
                                    초기화
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="hidden md:block overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 text-slate-500 text-xs border-y border-slate-200">
                                    <th className="p-4 font-medium">기간 (주차)</th>
                                    <th className="p-4 font-medium">부서</th>
                                    <th className="p-4 font-medium">작업명</th>
                                    <th className="p-4 font-medium">리더</th>
                                    <th className="p-4 font-medium">최종수정</th>
                                    <th className="p-4 font-medium text-center">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {filteredTbms.length === 0 ? (
                                    <tr><td colSpan="6" className="p-8 text-center text-gray-400">{currentYear}년도 등록된 TBM 내역이 없습니다.</td></tr>
                                ) : filteredTbms.map(tbm => (
                                    <tr key={tbm.id} className="hover:bg-gray-50 transition cursor-pointer" onClick={() => setSelectedTbm(tbm)}>
                                        <td className="p-4 text-sm text-gray-600 font-bold">{getFormattedWeek(tbm.date)}<div className="text-xs text-gray-400 font-normal">{tbm.date}</div></td>
                                        <td className="p-4 text-sm font-semibold text-slate-800">{tbm.department}</td>
                                        <td className="p-4 text-sm font-medium text-gray-800">{tbm.workName}</td>
                                        <td className="p-4 text-sm text-gray-600">{tbm.leader}</td>
                                        <td className="p-4 text-xs text-gray-500">{tbm.updatedAt ? new Date(tbm.updatedAt).toLocaleString() : '-'}</td>
                                        <td className="p-4 text-center">
                                            <div className="flex justify-center gap-2" onClick={(e) => e.stopPropagation()}>
                                                <button onClick={() => onEdit(tbm)} className="btn btn-ghost !min-h-[32px] !px-2.5 text-xs"><i className="fas fa-edit"></i> 수정</button>
                                                <button onClick={() => onDelete(tbm.id)} className="btn btn-ghost !min-h-[32px] !px-2.5 text-xs !text-red-700"><i className="fas fa-trash"></i> 삭제</button>
                                                {user.role === 'master' && (
                                                    <button onClick={() => onPdfDownload(tbm)} className="btn btn-ghost !min-h-[32px] !px-2.5 text-xs"><i className="fas fa-file-pdf"></i> PDF</button>
                                                )}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div className="md:hidden p-4 space-y-3">
                        {filteredTbms.length === 0 ? (
                            <div className="p-4 text-center text-gray-400 border rounded-lg">{currentYear}년도 등록된 TBM 내역이 없습니다.</div>
                        ) : filteredTbms.map(tbm => (
                            <div key={tbm.id} className="border border-slate-200 rounded-lg p-4 bg-white cursor-pointer" onClick={() => setSelectedTbm(tbm)}>
                                <div className="text-sm font-bold text-gray-700">{getFormattedWeek(tbm.date)}</div>
                                <div className="text-xs text-gray-400 mb-2">{tbm.date}</div>
                                <div className="text-sm text-slate-800 font-semibold mb-1">{tbm.department}</div>
                                <div className="text-sm font-medium text-gray-800 mb-1">{tbm.workName}</div>
                                <div className="text-sm text-gray-600 mb-3">리더: {tbm.leader}</div>
                                <div className="text-xs text-gray-500 mb-3">최종수정: {tbm.updatedAt ? new Date(tbm.updatedAt).toLocaleString() : '-'}</div>
                                <div className="grid grid-cols-2 gap-2 sm:flex sm:flex-wrap" onClick={(e) => e.stopPropagation()}>
                                    <button onClick={() => onEdit(tbm)} className="btn btn-ghost !min-h-[44px]"><i className="fas fa-edit mr-1"></i>수정</button>
                                    <button onClick={() => onDelete(tbm.id)} className="btn btn-ghost !min-h-[44px] !text-red-700"><i className="fas fa-trash mr-1"></i>삭제</button>
                                    {user.role === 'master' && (
                                        <button onClick={() => onPdfDownload(tbm)} className="col-span-2 btn btn-ghost !min-h-[44px]"><i className="fas fa-file-pdf mr-1"></i>PDF</button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                    {selectedTbm && (
                        <div className="fixed inset-0 z-50 bg-slate-950/45 backdrop-blur-sm flex items-end sm:items-center justify-center p-4" onClick={() => setSelectedTbm(null)}>
                            <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden max-h-[85dvh] flex flex-col animate-modal-rise" onClick={(e) => e.stopPropagation()}>
                                <div className="px-4 sm:px-5 py-4 border-b bg-slate-50 flex items-center justify-between">
                                    <div>
                                        <div className="text-xs text-slate-500">{selectedTbm.department} · {selectedTbm.date}</div>
                                        <div className="text-lg font-bold text-slate-800">{selectedTbm.workName || '-'}</div>
                                    </div>
                                    <button onClick={() => setSelectedTbm(null)} className="w-9 h-9 rounded-full border border-slate-200 text-slate-500 hover:bg-white">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-4 sm:p-5 space-y-4 overflow-y-auto">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                                        <div className="rounded-xl bg-slate-50 p-3"><div className="text-slate-400 text-xs mb-1">리더</div><div className="font-bold text-slate-800">{selectedTbm.leader || '-'}</div></div>
                                        <div className="rounded-xl bg-slate-50 p-3"><div className="text-slate-400 text-xs mb-1">장소</div><div className="font-bold text-slate-800">{selectedTbm.location || '-'}</div></div>
                                        <div className="rounded-xl bg-slate-50 p-3"><div className="text-slate-400 text-xs mb-1">위험성평가</div><div className={`font-bold ${selectedTbm.riskAssessmentDone ? 'text-emerald-700' : 'text-rose-600'}`}>{selectedTbm.riskAssessmentDone ? '실시' : '미실시'}</div></div>
                                        <div className="rounded-xl bg-slate-50 p-3"><div className="text-slate-400 text-xs mb-1">참석자</div><div className="font-bold text-slate-800">{selectedTbm.attendees?.length || 0}명</div></div>
                                    </div>
                                    <div>
                                        <div className="text-xs font-bold text-slate-500 mb-2">작업 내용</div>
                                        <div className="rounded-xl border border-slate-200 p-3 text-sm text-slate-700 whitespace-pre-wrap min-h-20">{selectedTbm.workDesc || '내용 없음'}</div>
                                    </div>
                                    <div>
                                        <div className="text-xs font-bold text-slate-500 mb-2">주요 위험요인</div>
                                        <div className="flex flex-wrap gap-2">
                                            {(selectedTbm.risks || []).filter(r => String(r.factor || '').trim()).slice(0, 6).map((risk, idx) => (
                                                <span key={idx} className="px-3 py-1 rounded-full text-xs bg-amber-50 text-amber-800 border border-amber-200">{risk.factor}</span>
                                            ))}
                                            {(!selectedTbm.risks || selectedTbm.risks.filter(r => String(r.factor || '').trim()).length === 0) && (
                                                <span className="text-sm text-slate-400">등록된 위험요인이 없습니다.</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="px-4 sm:px-5 py-4 border-t bg-slate-50 grid grid-cols-2 sm:flex sm:flex-wrap sm:justify-end gap-2 sticky bottom-0">
                                    <button onClick={() => { setSelectedTbm(null); onEdit(selectedTbm); }} className="btn btn-ghost !min-h-[44px]">수정</button>
                                    <button onClick={() => { setSelectedTbm(null); onDelete(selectedTbm.id); }} className="btn btn-ghost !min-h-[44px] !text-red-700">삭제</button>
                                    {user.role === 'master' && (
                                        <button onClick={() => onPdfDownload(selectedTbm)} className="col-span-2 btn btn-ghost !min-h-[44px]">PDF</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminView = ({ user, accounts, showToast }) => {
            const [newAcc, setNewAcc] = useState({ username: '', password: '', department: '생산팀', role: 'user' });
            const [editingId, setEditingId] = useState(null);
            const [newPassword, setNewPassword] = useState('');

            if (user?.role !== 'master') {
                return (
                    <div className="tone-panel p-8 rounded-xl text-center text-slate-500">
                        관리자 권한이 없어 계정 관리 화면에 접근할 수 없습니다.
                    </div>
                );
            }

            const handleCreateAccount = async () => {
                if (user?.role !== 'master') return showToast('관리자만 계정을 생성할 수 있습니다.', 'error');
                if(!newAcc.username || !newAcc.password) return showToast('정보를 입력하세요', 'error');
                try {
                    const passwordHash = await hashPassword(newAcc.password);
                    await addDoc(collection(db, "app_users"), {
                        username: newAcc.username.trim(),
                        department: newAcc.department.trim(),
                        role: newAcc.role,
                        passwordHash,
                        updatedAt: new Date().toISOString()
                    });
                    showToast('계정이 생성되었습니다.', 'success');
                    setNewAcc({ username: '', password: '', department: '생산팀', role: 'user' });
                } catch(e) { showToast('생성 실패', 'error'); }
            };
            const handleDeleteAccount = async (id) => {
                if (user?.role !== 'master') return showToast('관리자만 계정을 삭제할 수 있습니다.', 'error');
                if(confirm("삭제하시겠습니까?")) await deleteDoc(doc(db, "app_users", id));
            };
            const handleUpdatePassword = async (id) => {
                if (user?.role !== 'master') return showToast('관리자만 비밀번호를 변경할 수 있습니다.', 'error');
                if(!newPassword) return;
                const passwordHash = await hashPassword(newPassword);
                await updateDoc(doc(db, "app_users", id), { passwordHash, updatedAt: new Date().toISOString() });
                showToast('비밀번호 변경 완료', 'success');
                setEditingId(null);
            };

            // Explicit sort for rendering
            const sortedAccounts = [...accounts].sort((a, b) => (a.department || '').localeCompare(b.department || '', 'ko'));

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="tone-panel rounded-xl overflow-hidden">
                        <SectionHero chip={<><i className="fas fa-id-badge"></i> 계정 관리</>} title="계정 및 권한 관리" subtitle="사용자 계정 생성, 삭제, 비밀번호 재설정을 수행합니다" />
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1 tone-panel p-6 rounded-xl h-fit">
                                                <h3 className="text-[15px] font-bold mb-4 text-slate-900">새 계정 생성</h3>
                        <div className="space-y-4">
                            <input type="text" className="input-field" placeholder="아이디" value={newAcc.username} onChange={e=>setNewAcc({...newAcc, username: e.target.value})} />
                            <input type="password" className="input-field" placeholder="비밀번호" value={newAcc.password} onChange={e=>setNewAcc({...newAcc, password: e.target.value})} />
                            <input type="text" className="input-field" placeholder="부서명" value={newAcc.department} onChange={e=>setNewAcc({...newAcc, department: e.target.value})} />
                            <select className="input-field" value={newAcc.role} onChange={e=>setNewAcc({...newAcc, role: e.target.value})}>
                                <option value="user">사용자</option>
                                <option value="master">관리자</option>
                            </select>
                            <button onClick={handleCreateAccount} className="btn btn-primary w-full !min-h-[44px]">계정 생성</button>
                        </div>
                    </div>
                    <div className="lg:col-span-2 tone-panel p-6 rounded-xl">
                        <h3 className="text-[15px] font-bold mb-1 text-slate-900">등록된 계정 목록</h3>
                        <p className="text-sm text-slate-500 mb-4">부서명 기준 가나다순으로 정렬됩니다.</p>
                        <div className="grid gap-3">
                            {sortedAccounts.map(acc => (
                                <div key={acc.id} className="flex flex-col sm:flex-row justify-between items-center p-4 border border-slate-200 rounded-2xl hover:bg-slate-50 gap-3 bg-white/85">
                                    <div className="flex-1"><span className="font-bold text-slate-800">{acc.department}</span> <span className="text-slate-500">({acc.username})</span></div>
                                    <div className="flex items-center gap-2">
                                        {editingId === acc.id ? (
                                            <div className="flex gap-1">
                                                <input type="password" className="border rounded px-2 py-1 text-sm w-32" value={newPassword} onChange={e=>setNewPassword(e.target.value)} />
                                                <button onClick={()=>handleUpdatePassword(acc.id)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">저장</button>
